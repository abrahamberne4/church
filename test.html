          btn.onclick = () => edRemoveSongEverywhere(btn.dataset.removeAllCat, Number(btn.dataset.removeAllIdx));
        });

        $$('#modalBody [data-remove-cat]').forEach(btn => {
          btn.onclick = () => edRemoveSong(btn.dataset.removeCat, Number(btn.dataset.removeIdx));
        });

        const edDate = $('#edDate');
        if (edDate) {
          edDate.onchange = (e) => {
            window._editorState.date = e.target.value;
          };
        }
      }
    }

    window.validateCustomSinger = function (cat, idx) {
      const s = window._editorState;
      if (!s) return;
      const arr = cat === 'a' ? s.adoration : s.louange;
      if (!arr[idx]) return;

      const inp = $('#customSingerName');
      const name = inp ? inp.value.trim() : '';
      if (name) {
        arr[idx].singer = name;
        if (!STATE.singers.includes(name)) STATE.singers.push(name);
      } else {
        arr[idx].singer = STATE.singers[0] || '';
      }

      openModalFromState(s, window._editorOriginalDate);
    };

    window.edAddSong = function (cat) {
      if (!isAdmin) return;
      const s = window._editorState;
      if (!s) return;
      const target = cat === 'a' ? s.adoration : s.louange;
      target.push({ singer: STATE.singers[0] || '', title: '', url: '' });
      drawEditorLists();
    };

    window.edRemoveSong = function (cat, idx) {
      if (!isAdmin) return;
      const s = window._editorState;
      if (!s) return;
      const target = cat === 'a' ? s.adoration : s.louange;
      target.splice(idx, 1);
      drawEditorLists();
    };

    window.edRemoveSongEverywhere = function (cat, idx) {
      if (!isAdmin) return;
      const s = window._editorState;
      if (!s) return;
      const target = cat === 'a' ? s.adoration : s.louange;
      const songToDelete = target[idx];
      if (!songToDelete) return;

      const title = (songToDelete.title || '').trim();
      const url = (songToDelete.url || '').trim();
      const id = ytId(url);

      showConfirm({
        title: 'Supprimer partout ?',
        message: `Le chant <b>"${esc(title || 'Sans titre')}"</b> sera supprimé de <b>tous les dimanches</b>. Cette action est irréversible.`,
        confirmText: 'Supprimer partout',
        cancelText: 'Annuler',
        danger: true,
        onConfirm: () => {
          STATE.sundays.forEach(sunday => {
            sunday.adoration = (sunday.adoration || []).filter(x => {
              if (id && ytId(x.url) === id) return false;
              if (!id && (x.title || '').trim() === title) return false;
              return true;
            });
            sunday.louange = (sunday.louange || []).filter(x => {
              if (id && ytId(x.url) === id) return false;
              if (!id && (x.title || '').trim() === title) return false;
              return true;
            });
          });

          if (cat === 'a') {
            s.adoration.splice(idx, 1);
          } else {
            s.louange.splice(idx, 1);
          }

          save();
          openModalFromState(s, window._editorOriginalDate);
          toast('Chant supprimé partout');
        }
      });
    };

    window.edDuplicateSong = function (cat, idx) {
      if (!isAdmin) return;
      const s = window._editorState;
      if (!s) return;
      const target = cat === 'a' ? s.adoration : s.louange;
      const song = target[idx];
      if (!song || !(song.title || '').trim()) {
        toast("Veuillez d'abord remplir le titre");
        return;
      }

      const allSundays = [...STATE.sundays].sort((a, b) => a.date.localeCompare(b.date));
      let listHtml = allSundays.map((sd, i) => {
        const isCurrent = sd.date === s.date;
        return `
          <div class="dup-item" ${isCurrent ? 'style="background:rgba(232,200,106,0.05);border-color:var(--gold)"' : ''}>
            <input type="checkbox" id="dup_${i}" value="${sd.date}" ${isCurrent ? 'checked' : ''}>
            <label for="dup_${i}">${fmtDate(sd.date)} ${isCurrent ? '(En cours)' : ''}</label>
          </div>
        `;
      }).join('');

      openModal(`
        <div class="modal-header">
          <h3>Dupliquer vers...</h3>
          <button class="btn-close" onclick="reopenEditor()" aria-label="Fermer">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <p style="font-size:14px;color:var(--text-2);margin-bottom:12px">
          Sélectionnez les dimanches où ajouter <b>${esc(song.title)}</b>.
        </p>
        <div class="dup-list">${listHtml}</div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-ghost" style="flex:1" onclick="reopenEditor()">Annuler</button>
          <button class="btn btn-primary" style="flex:1" onclick="confirmDuplicate('${cat}', ${idx})">Copier sur les dimanches cochés</button>
        </div>
      `);
    };

    window.confirmDuplicate = function (cat, idx) {
      const s = window._editorState;
      if (!s) return;
      const target = cat === 'a' ? s.adoration : s.louange;
      const song = target[idx];
      if (!song) return;

      const checked = $$('.dup-list input[type="checkbox"]:checked');
      if (checked.length === 0) {
        toast('Aucun dimanche sélectionné');
        return;
      }

      let count = 0;
      checked.forEach(cb => {
        const date = cb.value;
        const targetSunday = STATE.sundays.find(x => x.date === date);
        if (targetSunday) {
          const targetList = cat === 'a' ? (targetSunday.adoration || []) : (targetSunday.louange || []);
          const songKey = (song.url && ytId(song.url)) ? ytId(song.url) : (song.title || '').trim().toLowerCase();
          const isDuplicate = targetList.some(x => {
            const xKey = (x.url && ytId(x.url)) ? ytId(x.url) : (x.title || '').trim().toLowerCase();
            return xKey === songKey;
          });
          if (!isDuplicate) {
            const newSong = { ...song };
            if (cat === 'a') {
              targetSunday.adoration = targetSunday.adoration || [];
              targetSunday.adoration.push(newSong);
            } else {
              targetSunday.louange = targetSunday.louange || [];
              targetSunday.louange.push(newSong);
            }
            count++;
          }
        }
      });

      save();
      if (count > 0) {
        toast(`✓ Chant ajouté à ${count} dimanche(s)`);
      } else {
        toast('Chant déjà présent partout');
      }
      openModalFromState(s, window._editorOriginalDate);
    };

    /* ===== SAVE SUNDAY ===== */
    window.saveSunday = function (originalDate) {
      if (!isAdmin) return;
      const s = window._editorState;
      if (!s) return;

      const newDate = $('#edDate') ? $('#edDate').value : s.date;
      if (!newDate) {
        toast('Date requise');
        return;
      }

      const targetDate = originalDate || newDate;

      if (newDate !== targetDate) {
        const conflict = STATE.sundays.find(x => x.date === newDate && x.date !== targetDate);
        if (conflict) {
          toast('Un dimanche existe déjà à cette date');
          return;
        }
      }

      s.date = newDate;
      s.adoration = (s.adoration || []).filter(x => (x.title || '').trim());
      s.louange = (s.louange || []).filter(x => (x.title || '').trim());

      const updateOtherOccurrences = (editedSongs) => {
        editedSongs.forEach(song => {
          if (!(song.title || '').trim()) return;
          const targetYtId = ytId(song.url);
          STATE.sundays.forEach(otherSunday => {
            if (otherSunday.date === targetDate) return;
            [...(otherSunday.adoration || []), ...(otherSunday.louange || [])].forEach(otherSong => {
              const otherYtId = ytId(otherSong.url);
              const isSameSong = targetYtId
                ? (otherYtId === targetYtId)
                : ((otherSong.title || '').trim() === (song.title || '').trim());
              if (isSameSong && (otherSong.title !== song.title || otherSong.url !== song.url)) {
                otherSong.title = song.title;
                otherSong.url = song.url;
              }
            });
          });
        });
      };

      updateOtherOccurrences(s.adoration);
      updateOtherOccurrences(s.louange);

      const idx = STATE.sundays.findIndex(x => x.date === targetDate);
      if (idx >= 0) {
        STATE.sundays[idx] = s;
      } else {
        STATE.sundays.push(s);
      }
      STATE.sundays.sort((a, b) => a.date.localeCompare(b.date));

      if (!save()) return;
      closeModal();
      render();
      toast('✓ Programme enregistré');
    };

    window.deleteSunday = function (date) {
      if (!isAdmin) return;
      const sunday = STATE.sundays.find(x => x.date === date);
      const songCount = sunday ? ((sunday.adoration || []).length + (sunday.louange || []).length) : 0;

      showConfirm({
        title: 'Supprimer ce dimanche ?',
        message: `Le programme du <b>${fmtDate(date)}</b> sera supprimé${songCount > 0 ? ` avec ses <b>${songCount} chant(s)</b>` : ''}. Cette action est irréversible.`,
        confirmText: 'Supprimer',
        cancelText: 'Annuler',
        danger: true,
        onConfirm: () => {
          STATE.sundays = STATE.sundays.filter(x => x.date !== date);
          save();
          closeModal();
          render();
          toast('Programme supprimé');
        }
      });
    };

    window.editSong = function (date, cat, title) {
      if (!isAdmin) return;
      openEditor(date);
    };

    /* ===== RESET & EXPORT ===== */
    window.confirmReset = function () {
      if (!isAdmin) {
        toast('Déverrouillez d\'abord le mode Admin');
        return;
      }
      showConfirm({
        title: 'Réinitialiser tout le code ?',
        message: 'Toutes vos modifications seront <b>définitivement perdues</b>. Le programme d\'origine sera restauré.',
        confirmText: 'Réinitialiser',
        cancelText: 'Annuler',
        danger: true,
        onConfirm: () => {
          localStorage.removeItem(STORAGE_KEY);
          STATE = { singers: clone(SEED_SINGERS), sundays: clone(SEED_SUNDAYS) };
          save();
          render();
          toast('Données réinitialisées');
        }
      });
    };

    window.exportHTML = function () {
      if (!isAdmin) return;

      try {
        const doctype = '<!DOCTYPE html>\n';
        let htmlContent = document.documentElement.outerHTML;

        const seedSingersRegex = /const SEED_SINGERS = \[[\s\S]*?\];/;
        const seedSundaysRegex = /const SEED_SUNDAYS = \[[\s\S]*?\];/;

        const newSingers = `const SEED_SINGERS = ${JSON.stringify(STATE.singers, null, 4)};\n`;
        const newSundays = `const SEED_SUNDAYS = ${JSON.stringify(STATE.sundays, null, 4)}\n`;

        htmlContent = htmlContent.replace(seedSingersRegex, newSingers);
        htmlContent = htmlContent.replace(seedSundaysRegex, newSundays);

        const resetScript = '<script>try{localStorage.removeItem("' + STORAGE_KEY + '");}catch(e){}</' + 'script>';
        htmlContent = htmlContent.replace('<body>', '<body>\n' + resetScript);

        const fullHtml = doctype + htmlContent;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const fileName = `abraham-berne-mygod-${new Date().toISOString().slice(0, 10)}.html`;

        const isMobile = /Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test(navigator.userAgent);

        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);

        if (isMobile) {
          showExportFallbackModal(fullHtml, fileName);
        } else {
          toast('📥 HTML exporté');
        }
      } catch (err) {
        console.error('Export error:', err);
        toast('❌ Erreur lors de l\'export');
      }
    };

    function showExportFallbackModal(htmlContent, fileName) {
      const escapedHtml = htmlContent.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      openModal(`
        <div class="modal-header">
          <h3>📥 Export HTML</h3>
          <button class="btn-close" onclick="closeModal()" aria-label="Fermer">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <p style="font-size:14px;color:var(--text-2);margin-bottom:16px">
          Si le téléchargement ne s'est pas lancé, copiez le code ci-dessous et collez-le dans un fichier <b>.html</b>.
        </p>
        <div class="field">
          <textarea id="exportCodeArea" class="export-textarea" readonly>${escapedHtml}</textarea>
        </div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Fermer</button>
          <button class="btn btn-primary" style="flex:1" onclick="copyExportCode()">📋 Copier</button>
        </div>
      `);
    }

    window.copyExportCode = function () {
      const textarea = document.getElementById('exportCodeArea');
      if (!textarea) return;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(textarea.value).then(() => {
          toast('Code copié ! Collez-le dans un fichier .html');
        }).catch(() => fallbackCopy(textarea));
      } else {
        fallbackCopy(textarea);
      }
      function fallbackCopy(textarea) {
        textarea.select();
        textarea.setSelectionRange(0, 99999);
        try {
          document.execCommand('copy');
          toast('Code copié ! Collez-le dans un fichier .html');
        } catch (e) {
          toast('Échec de la copie. Sélectionnez le texte manuellement.');
        }
      }
    };

    window.addEventListener('error', (e) => { console.error('Erreur JS:', e.error || e.message); });
    window.addEventListener('unhandledrejection', (e) => { console.error('Promesse rejetée:', e.reason); });

    /* ===== BACKGROUND CAROUSEL (DESKTOP UNIQUEMENT) ===== */
    function initBackgroundCarousel() {
      const isDesktop = window.matchMedia('(min-width: 1024px)').matches;
      const carousel = document.getElementById('bg-carousel');
      if (!isDesktop || !carousel) return;

      carousel.classList.remove('hidden');

      // Images d'église / adoration / louange (Unsplash - libres de droits)
      const images = [
        'https://images.unsplash.com/photo-1504052434569-70ad5836ab65?w=1920&q=80', // église
        'https://images.unsplash.com/photo-1548625149-fc4a29cf7092?w=1920&q=80', // croix montagne
        'https://images.unsplash.com/photo-1507692049790-de58290a4334?w=1920&q=80', // louange
        'https://images.unsplash.com/photo-1519677100203-a0e668c92439?w=1920&q=80', // bible
        'https://images.unsplash.com/photo-1499209974431-9dddcece7f88?w=1920&q=80', // lumière
        'https://images.unsplash.com/photo-1478147427282-58a87a120781?w=1920&q=80', // ciel
        'https://images.unsplash.com/photo-1510925758641-869d353cecc7?w=1920&q=80', // prière
        'https://images.unsplash.com/photo-1445445290350-18a3b8a5e5e1?w=1920&q=80', // église intérieur
        'https://images.unsplash.com/photo-1504052434569-70ad5836ab65?w=1920&q=80', // église
        'https://images.unsplash.com/photo-1548625149-fc4a29cf7092?w=1920&q=80', // croix
      ];

      // Créer les slides
      images.forEach((url, i) => {
        const slide = document.createElement('div');
        slide.className = 'bg-slide';
        slide.style.backgroundImage = `url(${url})`;
        if (i === 0) slide.classList.add('active');
        carousel.appendChild(slide);
      });

      // Rotation automatique
      let currentSlide = 0;
      const slides = carousel.querySelectorAll('.bg-slide');
      if (slides.length > 1) {
        setInterval(() => {
          slides[currentSlide].classList.remove('active');
          currentSlide = (currentSlide + 1) % slides.length;
          slides[currentSlide].classList.add('active');
        }, 6000);
      }
    }

    /* ===== INIT ===== */
    load();
    updateLockIcon();
    render();
    initBackgroundCarousel();

    // Écouter les changements de taille pour activer/désactiver le carrousel
    window.matchMedia('(min-width: 1024px)').addEventListener('change', (e) => {
      const carousel = document.getElementById('bg-carousel');
      if (e.matches) {
        if (carousel) carousel.classList.remove('hidden');
        if (!carousel.hasChildNodes()) initBackgroundCarousel();
      } else {
        if (carousel) carousel.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
