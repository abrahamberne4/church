<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Abraham Berne myGod</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==== RESET & TOKENS (MOBILE INTACT) ==== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0c;
      --bg-1: #101014;
      --bg-2: #16161c;
      --bg-3: #1e1e26;
      --bg-4: #282833;
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.14);
      --text: #f5f5f7;
      --text-2: #a8a8b3;
      --text-3: #6a6a75;
      --gold: #e8c86a;
      --gold-2: #d4a935;
      --gold-glow: rgba(232, 200, 106, 0.25);
      --red: #f87171;
      --green: #4ade80;
      --blue: #60a5fa;
      --radius-s: 10px;
      --radius: 16px;
      --radius-l: 22px;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
      --shadow-lg: 0 12px 48px rgba(0, 0, 0, 0.6);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --content-max: 1180px;
      --content-pad: 16px;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }
    html { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(232, 200, 106, 0.08), transparent),
        radial-gradient(ellipse 60% 30% at 100% 100%, rgba(212, 169, 53, 0.04), transparent);
    }
    .hidden { display: none !important; }
    .gold { color: var(--gold); }

    /* === HEADER (MOBILE INTACT) === */
    header {
      flex-shrink: 0;
      z-index: 40;
      padding: calc(14px + var(--safe-top)) var(--content-pad) 14px;
      background: rgba(10, 10, 12, 0.72);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      transition: all 0.3s ease;
    }
    .header-inner {
      max-width: var(--content-max); margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #f0d580, #b88f1a);
      color: #0a0a0c; font-weight: 800; font-size: 19px;
      box-shadow: 0 4px 16px rgba(212, 169, 53, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      flex-shrink: 0;
      letter-spacing: -0.02em;
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand h1 { font-size: 15px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; }
    .brand .tag { font-size: 10px; color: var(--text-3); font-weight: 600; margin-top: 3px; text-transform: uppercase; letter-spacing: 0.08em; }
    .header-actions { display: flex; align-items: center; gap: 6px; }
    .btn-lock {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: var(--text-2);
      border-radius: 50%;
      width: 38px; height: 38px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      position: relative;
      overflow: hidden;
    }
    .btn-lock:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
    .btn-lock.locked {
      background: rgba(232, 200, 106, 0.15);
      border-color: rgba(232, 200, 106, 0.4);
      color: var(--gold);
      box-shadow: 0 0 20px rgba(232, 200, 106, 0.15);
    }
    .btn-reset-icon {
      background: transparent;
      border: none;
      color: var(--text-3);
      width: 38px; height: 38px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 50%;
    }
    .btn-reset-icon:hover { background: rgba(248, 113, 113, 0.1); color: var(--red); }

    /* === MAIN CONTENT (MOBILE INTACT) === */
    .scroll-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(90px + var(--safe-bottom));
    }
    main {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 28px var(--content-pad) 0;
      animation: fadeIn 0.35s ease-out;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    h2.page-title { font-size: clamp(24px, 4vw, 32px); font-weight: 800; letter-spacing: -0.03em; margin-bottom: 6px; line-height: 1.15; }
    p.page-sub { color: var(--text-2); font-size: 14px; margin-bottom: 28px; max-width: 60ch; }
    .section { font-size: 14px; font-weight: 600; color: var(--text-2); margin: 32px 0 14px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; letter-spacing: 0.08em; }
    .section::before { content: ""; width: 3px; height: 14px; background: var(--gold); border-radius: 2px; }

    /* == CARDS & UTILS (MOBILE INTACT) === */
    .card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; transition: all 0.2s; }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: var(--border-strong); background: var(--bg-3); transform: translateY(-1px); }
    .card.clickable:active { transform: scale(0.985); }
    .grid { display: grid; gap: 12px; }
    .g3 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .g4 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

    /* === STATS (MOBILE INTACT) === */
    .stat { background: linear-gradient(160deg, var(--bg-2), var(--bg-3)); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 16px; text-align: center; position: relative; overflow: hidden; }
    .stat::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0.6; }
    .stat .n { font-size: clamp(24px, 3vw, 32px); font-weight: 800; color: var(--gold); letter-spacing: -0.03em; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .stat .l { font-size: 11px; color: var(--text-2); margin-top: 6px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }

    /* === SUNDAY CARD (LIST) (MOBILE INTACT) === */
    .scard { cursor: pointer; padding: 18px; background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); transition: all 0.2s; position: relative; overflow: hidden; }
    .scard::after { content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px; background: linear-gradient(180deg, var(--gold), transparent); opacity: 0.5; }
    .scard:hover { border-color: var(--gold-glow); background: var(--bg-3); transform: translateY(-2px); box-shadow: var(--shadow); }
    .scard:active { transform: scale(0.99); }
    .scard .date { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: var(--text); letter-spacing: -0.01em; }
    .scard .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .pill { padding: 3px 10px; border-radius: 20px; font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
    .pill-a { background: rgba(232, 200, 106, 0.15); color: var(--gold); }
    .pill-l { background: rgba(96, 165, 250, 0.15); color: var(--blue); }
    .scard .singers { font-size: 12px; color: var(--text-2); line-height: 1.4; font-weight: 400; }

    /* === TINDER CARDS (HOME) (MOBILE INTACT) === */
    .tinder-container { position: relative; width: 100%; max-width: 420px; margin: 0 auto 24px; height: 480px; perspective: 1000px; }
    .tinder-card {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(160deg, var(--bg-2), var(--bg-3));
      border: 1px solid var(--border-strong); border-radius: var(--radius-l);
      padding: 24px; display: flex; flex-direction: column;
      box-shadow: var(--shadow-lg); cursor: grab;
      transition: transform 0.3s ease, opacity 0.3s ease;
      transform-origin: center bottom;
      user-select: none;
      will-change: transform;
    }
    .tinder-card-active { cursor: grabbing; }
    .tinder-card-swipe-left { transform: translateX(-120%) rotate(-15deg); opacity: 0; }
    .tinder-card-swipe-right { transform: translateX(120%) rotate(15deg); opacity: 0; }
    .tinder-card .card-date { font-size: 22px; font-weight: 700; color: var(--gold); margin-bottom: 6px; letter-spacing: -0.02em; line-height: 1.2; }
    .tinder-card .card-singers { font-size: 13px; color: var(--text-2); margin-bottom: 18px; font-weight: 500; line-height: 1.4; }
    .tinder-card .card-songs { flex: 1; overflow-y: auto; padding-right: 8px; margin-right: -8px; display: flex; flex-direction: column; gap: 12px; }
    .tinder-card .card-songs::-webkit-scrollbar { width: 4px; }
    .tinder-card .card-songs::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }
    .tinder-card .song-preview { font-size: 13px; padding-bottom: 12px; border-bottom: 1px solid var(--border); line-height: 1.45; font-weight: 400; color: var(--text); text-align: left; }
    .tinder-card .song-preview:last-child { border-bottom: none; padding-bottom: 0; }
    .tinder-card .card-actions { margin-top: 18px; display: flex; gap: 8px; flex-shrink: 0; }
    .tinder-card .card-actions .btn { flex: 1; }
    .tinder-nav { display: flex; justify-content: center; align-items: center; gap: 20px; margin-top: -10px; margin-bottom: 24px; color: var(--text-3); font-size: 13px; }
    .tinder-nav button { background: var(--bg-2); border: 1px solid var(--border); color: var(--text); width: 42px; height: 42px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; font-size: 18px; transition: all 0.2s; }
    .tinder-nav button:hover { background: var(--bg-3); border-color: var(--gold); }
    .tinder-nav button:active { transform: scale(0.9); }
    .tinder-nav .counter { font-weight: 600; min-width: 60px; text-align: center; font-variant-numeric: tabular-nums; }

    /* === FORMS (MOBILE INTACT) === */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; letter-spacing: 0.02em; }
    input, select, textarea { width: 100%; padding: 12px 14px; background: var(--bg-1); border: 1px solid var(--border); border-radius: var(--radius-s); color: var(--text); font-size: 14px; font-family: inherit; transition: all 0.15s; font-weight: 400; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); background: var(--bg-2); box-shadow: 0 0 0 3px var(--gold-glow); }

    /* === BUTTONS (MOBILE INTACT) === */
    .btn { border: none; border-radius: 12px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.15s; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; line-height: 1.2; min-height: 44px; }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: linear-gradient(160deg, #f0d580, var(--gold-2)); color: #0a0a0c; box-shadow: 0 4px 16px rgba(212, 169, 53, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.3); }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-ghost { background: var(--bg-3); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-4); }
    .btn-danger { background: rgba(248, 113, 113, 0.1); color: var(--red); border: 1px solid rgba(248, 113, 113, 0.2); }
    .btn-danger:hover { background: rgba(248, 113, 113, 0.15); }
    .btn-sm { padding: 8px 14px; font-size: 12px; min-height: 36px; border-radius: 10px; }
    .btn-icon { padding: 0; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; }
    .btn-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* === SONG ROW (MOBILE INTACT) === */
    .song-item { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--bg-1); border: 1px solid var(--border); margin-bottom: 8px; transition: all 0.15s; }
    .song-item:hover { border-color: var(--border-strong); }
    .song-thumb { width: 56px; height: 56px; border-radius: 8px; background: var(--bg-3); flex-shrink: 0; object-fit: cover; display: grid; place-items: center; color: var(--text-3); font-size: 20px; overflow: hidden; }
    .song-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .song-info { flex: 1; min-width: 0; }
    .song-title { font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35; }
    .song-meta { font-size: 11px; color: var(--text-2); display: flex; gap: 8px; flex-wrap: wrap; }
    .song-meta .singer { color: var(--gold); font-weight: 500; }

    /* === MODAL (MOBILE INTACT) === */
    .modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end; justify-content: center; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: modalBg 0.2s; overflow: hidden; }
    @keyframes modalBg { from { opacity: 0; } to { opacity: 1; } }
    .modal-sheet { background: var(--bg-2); border-radius: 24px 24px 0 0; width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; padding: 8px 20px calc(24px + var(--safe-bottom)); box-shadow: var(--shadow-lg); animation: sheetUp 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2); position: relative; -webkit-overflow-scrolling: touch; }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: var(--bg-4); border-radius: 2px; margin: 0 auto 16px; }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
    .modal-header h3 { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -0.02em; flex: 1; }
    .btn-close { background: var(--bg-3); border: none; color: var(--text-2); width: 32px; height: 32px; border-radius: 50%; cursor: pointer; display: grid; place-items: center; flex-shrink: 0; transition: all 0.15s; }
    .btn-close:hover { background: var(--bg-4); color: var(--text); }
    .btn-close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }

    /* == MODAL DE CONFIRMATION == */
    .confirm-sheet { background: var(--bg-2); border-radius: 24px; width: calc(100% - 32px); max-width: 400px; margin: auto; padding: 28px 24px; box-shadow: var(--shadow-lg); animation: confirmPop 0.25s cubic-bezier(0.2, 0.9, 0.3, 1.2); text-align: center; }
    @keyframes confirmPop { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    .confirm-icon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; margin: 0 auto 16px; background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.25); }
    .confirm-icon svg { width: 32px; height: 32px; stroke: var(--red); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .confirm-icon.warning { background: rgba(232, 200, 106, 0.12); border-color: rgba(232, 200, 106, 0.25); }
    .confirm-icon.warning svg { stroke: var(--gold); }
    .confirm-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; letter-spacing: -0.01em; }
    .confirm-message { font-size: 14px; color: var(--text-2); margin-bottom: 24px; line-height: 1.5; }
    .confirm-message b { color: var(--text); font-weight: 600; }
    .confirm-actions { display: flex; gap: 10px; }
    .confirm-actions .btn { flex: 1; }
    .confirm-actions .btn-danger-confirm { background: linear-gradient(160deg, #f87171, #dc2626); color: #fff; box-shadow: 0 4px 16px rgba(220, 38, 38, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.2); }
    .confirm-actions .btn-danger-confirm:hover { filter: brightness(1.05); }

    /* === CALENDAR (MOBILE INTACT) === */
    .cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
    .month-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; }
    .month-title { font-size: 13px; font-weight: 700; color: var(--gold); text-transform: capitalize; margin-bottom: 12px; letter-spacing: 0.02em; }
    .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .day { aspect-ratio: 1; display: grid; place-items: center; border-radius: 7px; font-size: 11px; background: var(--bg-1); color: var(--text-3); font-weight: 500; }
    .day.has { background: linear-gradient(160deg, var(--gold), var(--gold-2)); color: #0a0a0c; font-weight: 700; cursor: pointer; box-shadow: 0 2px 8px rgba(212, 169, 53, 0.3); transition: all 0.15s; }
    .day.has:hover { transform: scale(1.08); }
    .day-dow { background: transparent; color: var(--text-3); font-weight: 600; }

    /* === PROJECTION (MOBILE INTACT) === */
    .proj { background: #000; color: #fff; min-height: 80vh; padding: 48px 32px; text-align: center; border-radius: var(--radius); margin-top: 16px; }
    .proj h1 { font-size: clamp(24px, 5vw, 42px); color: var(--gold); margin-bottom: 8px; font-weight: 800; letter-spacing: -0.02em; }
    .proj .date { font-size: clamp(14px, 2.5vw, 18px); color: #ccc; margin-bottom: 24px; }
    .proj .singers-line { font-size: clamp(16px, 3vw, 22px); color: var(--gold); margin-bottom: 32px; font-weight: 600; }
    .proj h2 { font-size: clamp(18px, 3.5vw, 24px); color: var(--gold); margin: 32px 0 16px; padding-bottom: 10px; border-bottom: 1px solid rgba(232, 200, 106, 0.3); letter-spacing: 0.08em; }
    .proj .song-block { margin-bottom: 20px; }
    .proj .song-block .title { font-size: clamp(16px, 3vw, 22px); line-height: 1.4; margin-bottom: 4px; font-weight: 500; }
    .proj .song-block .singer { font-size: clamp(12px, 2vw, 15px); color: var(--gold); font-weight: 600; }

    /* === SINGER BADGES (MOBILE INTACT) === */
    .singer-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .singer-badge { background: var(--bg-2); border: 1px solid var(--border); border-radius: 50px; padding: 10px 20px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px; color: var(--text); }
    .singer-badge:hover { border-color: var(--gold); background: var(--bg-3); }
    .singer-badge.active { background: var(--gold); color: #0a0a0c; border-color: var(--gold); font-weight: 600; }
    .singer-badge .count { background: rgba(0, 0, 0, 0.2); border-radius: 12px; padding: 2px 8px; font-size: 11px; font-weight: 700; }

    /* === EMPTY (MOBILE INTACT) === */
    .empty { text-align: center; padding: 48px 20px; color: var(--text-3); font-size: 14px; }
    .empty svg { width: 48px; height: 48px; stroke: currentColor; fill: none; stroke-width: 1.5; opacity: 0.5; margin-bottom: 12px; }

    /* === BOTTOM NAV (MOBILE INTACT) === */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 50; display: flex; justify-content: space-around; align-items: center; padding: 8px 8px calc(8px + var(--safe-bottom)); background: rgba(10, 10, 12, 0.85); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border-top: 1px solid rgba(255, 255, 255, 0.06); }
    .nav-item { background: transparent; border: none; color: var(--text-3); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 4px; font-size: 10px; font-weight: 500; cursor: pointer; transition: all 0.2s; border-radius: 12px; flex: 1; max-width: 70px; font-family: inherit; }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .nav-item.active { color: var(--gold); }

    /* === TOAST (MOBILE INTACT) === */
    .toast { position: fixed; bottom: calc(90px + var(--safe-bottom)); left: 50%; transform: translateX(-50%); background: var(--bg-4); color: var(--text); padding: 12px 24px; border-radius: 12px; font-size: 13px; font-weight: 500; box-shadow: var(--shadow-lg); z-index: 200; animation: toastIn 0.3s ease-out; border: 1px solid var(--border-strong); max-width: 90vw; text-align: center; }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* === MODAL SPECIFICS (MOBILE INTACT) === */
    .reset-modal-icon { text-align: center; margin-bottom: 16px; }
    .reset-modal-icon svg { width: 48px; height: 48px; stroke: var(--red); fill: none; stroke-width: 1.5; }

    /* ==========================================================================

      /* --- TOKENS DESKTOP --- */

    }

    let currentView = 'home';
    let currentTinderIndex = 0;
    let isAdmin = false;
    let sortedSundays = [];
    let projectionDate = null;
    let swipeLocked = false;

    function clone(o) { return JSON.parse(JSON.stringify(o)); }

    /* ===== STORAGE ===== */
    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.singers) && Array.isArray(parsed.sundays)) {
            STATE = parsed;
            STATE.sundays = STATE.sundays.filter(s => s && typeof s.date === 'string');
            STATE.sundays.forEach(s => {
              if (!Array.isArray(s.adoration)) s.adoration = [];
              if (!Array.isArray(s.louange)) s.louange = [];
            });
            return;
          }
        }
      } catch (e) {
        console.warn('localStorage corrompu, réinitialisation', e);
        setTimeout(() => toast('⚠️ Données corrompues. Réinitialisation.'), 100);
      }
      STATE = { singers: clone(SEED_SINGERS), sundays: clone(SEED_SUNDAYS) };
      save();
    }

    function save() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
        return true;
      } catch (e) {
        console.error('Erreur de sauvegarde localStorage', e);
        setTimeout(() => toast('❌ Échec de sauvegarde (stockage plein ?)'), 50);
        return false;
      }
    }

    const $ = s => document.querySelector(s);
    const $$ = s => [...document.querySelectorAll(s)];
    const esc = s => String(s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    function fmtDate(iso) {
      const d = new Date(iso + 'T12:00:00');
      return d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function ytId(url) {
      if (!url) return null;
      const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
      return m ? m[1] : null;
    }

    function ytThumb(url) {
      const id = ytId(url);
      return id ? `https://img.youtube.com/vi/${id}/mqdefault.jpg` : null;
    }

    let toastTimer;
    function toast(msg, ms = 2200) {
      const t = $('#toast');
      if (!t) return;
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => t.classList.add('hidden'), ms);
    }

    function openModal(html, opts = {}) {
      $('#modalBody').innerHTML = html;
      $('#modal').classList.remove('hidden');
      $('#modalSheet').style.borderRadius = opts.center ? '24px' : '';
      $('#modalSheet').style.margin = opts.center ? 'auto' : '';
    }

    function closeModal() {
      $('#modal').classList.add('hidden');
      $('#modalSheet').style.borderRadius = '';
    }

    /* ===== CONFIRMATION CUSTOM ===== */
    function showConfirm(opts) {
      const { title = 'Confirmer', message = 'Êtes-vous sûr ?', confirmText = 'Confirmer', cancelText = 'Annuler', danger = true, onConfirm = () => {}, onCancel = () => {} } = opts;

      const iconSvg = danger
        ? '<svg viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>'
        : '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';

      openModal(
        `<div class="confirm-sheet">
          <div class="confirm-icon ${danger ? '' : 'warning'}">${iconSvg}</div>
          <div class="confirm-title">${esc(title)}</div>
          <div class="confirm-message">${message}</div>
          <div class="confirm-actions">
            <button class="btn btn-ghost" id="confirmCancelBtn">${esc(cancelText)}</button>
            <button class="btn ${danger ? 'btn-danger-confirm' : 'btn-primary'}" id="confirmOkBtn">${esc(confirmText)}</button>
          </div>
        </div>`,
        { center: true }
      );

      const cleanup = () => { closeModal(); };
      const okBtn = $('#confirmOkBtn');
      const cancelBtn = $('#confirmCancelBtn');
      if (okBtn) okBtn.onclick = () => { cleanup(); onConfirm(); };
      if (cancelBtn) cancelBtn.onclick = () => { cleanup(); onCancel(); };
      $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
    }

    /* ===== LOCK / UNLOCK ===== */
    window.promptLock = function () {
      if (isAdmin) {
        isAdmin = false;
        updateLockIcon();
        render();
        toast('Mode lecture seule activé');
      } else {
        openModal(
          `<div class="modal-header">
            <h3>Administration</h3>
            <button class="btn-close" onclick="closeModal()" aria-label="Fermer">
              <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <p style="font-size:13px;color:var(--text-2);margin-bottom:16px">Entrez le code pour déverrouiller les modifications.</p>
          <div class="field">
            <input type="password" id="adminPwd" placeholder="Code secret" style="text-align:center;letter-spacing:4px;font-size:18px;padding:14px;" autocomplete="off">
          </div>
          <button class="btn btn-primary" style="width:100%" onclick="validateLock()">Déverrouiller</button>`
        );
        setTimeout(() => {
          const inp = $('#adminPwd');
          if (inp && document.body.contains(inp)) {
            inp.focus();
            inp.addEventListener('keypress', (e) => { if (e.key === 'Enter') validateLock(); });
          }
        }, 100);
      }
    };

    window.validateLock = function () {
      const inp = $('#adminPwd');
      if (!inp) return;
      const pwd = inp.value;
      if (pwd === ADMIN_PASSWORD) {
        isAdmin = true;
        updateLockIcon();
        closeModal();
        render();
        toast('Mode édition déverrouillé');
      } else {
        toast('Code incorrect');
        inp.value = '';
        inp.focus();
      }
    };

    function updateLockIcon() {
      const btn = $('#lockBtn');
      const icon = $('#lockIcon');
      if (isAdmin) {
        btn.classList.add('locked');
        icon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>';
        $('#exportBtn').classList.remove('hidden');
        $('#resetBtn').classList.remove('hidden');
      } else {
        btn.classList.remove('locked');
        icon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path>';
        $('#exportBtn').classList.add('hidden');
        $('#resetBtn').classList.add('hidden');
      }
    }

    /* ===== NAVIGATION ===== */
    $$('.nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        $$('.nav-item').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentView = btn.dataset.view;
        render();
        document.querySelector('.scroll-container').scrollTo({ top: 0, behavior: 'smooth' });
      });
    });

    function render() {
      closeModal();
      const view = $('#view');
      switch (currentView) {
        case 'home': return renderHome(view);
        case 'sundays': return renderSundays(view);
        case 'calendar': return renderCalendar(view);
        case 'singer': return renderBySinger(view);
        case 'search': return renderSearch(view);
        case 'projection': return renderProjection(view);
      }
    }

    /* ===== HOME ===== */
    function renderHome(view) {
      sortedSundays = [...STATE.sundays].sort((a, b) => a.date.localeCompare(b.date));
      const today = new Date().toISOString().slice(0, 10);
      let startIndex = sortedSundays.findIndex(s => s.date >= today);
      if (startIndex === -1) startIndex = sortedSundays.length - 1;
      currentTinderIndex = Math.max(0, startIndex);

      const songSet = new Set();
      STATE.sundays.forEach(s => {
        [...(s.adoration || []), ...(s.louange || [])].forEach(x => songSet.add(x.title.trim().toLowerCase()));
      });

      view.innerHTML = `
        <h2 class="page-title">Bienvenue</h2>
        <p class="page-sub">Programme musical du groupe Abraham Berne</p>
        <div class="grid g4" style="margin-bottom:28px">
          <div class="stat"><div class="n">${STATE.sundays.length}</div><div class="l">Dimanches</div></div>
          <div class="stat"><div class="n">${STATE.singers.length}</div><div class="l">Chantres</div></div>
          <div class="stat"><div class="n">${songSet.size}</div><div class="l">Chants</div></div>
        </div>
        <h3 class="section">Programme du jour</h3>
        <div class="tinder-container" id="tinderContainer"></div>
        <div class="tinder-nav">
          <button id="prevBtn" aria-label="Précédent">←</button>
          <span class="counter" id="tinderCounter">1/${sortedSundays.length || 1}</span>
          <button id="nextBtn" aria-label="Suivant">→</button>
        </div>
      `;

      const container = $('#tinderContainer');
      const counter = $('#tinderCounter');
      if (sortedSundays.length === 0) {
        container.innerHTML = '<div class="empty" style="margin-top:100px">Aucun dimanche</div>';
        return;
      }

      function createCard(sunday, index) {
        const card = document.createElement('div');
        card.className = 'tinder-card';
        card.dataset.index = index;

        const actionButtons = isAdmin
          ? `<div class="card-actions">
              <button class="btn btn-ghost btn-sm" data-action="details">Détails</button>
              <button class="btn btn-primary btn-sm" data-action="edit">Modifier</button>
            </div>`
          : `<div class="card-actions">
              <button class="btn btn-ghost btn-sm" data-action="details" style="flex:1">Voir les détails</button>
            </div>`;

        card.innerHTML = `
          <div class="card-date">${fmtDate(sunday.date)}</div>
          <div class="card-singers">${esc([...new Set([...(sunday.adoration || []), ...(sunday.louange || [])].map(x => x.singer))].join(' · '))}</div>
          <div class="card-songs">
            ${(sunday.adoration || []).map(x => `<div class="song-preview">${esc(x.title)}</div>`).join('')}
            ${(sunday.louange || []).map(x => `<div class="song-preview">${esc(x.title)}</div>`).join('')}
            ${(!sunday.adoration || sunday.adoration.length === 0) && (!sunday.louange || sunday.louange.length === 0) ? '<div style="color:var(--text-3);text-align:center;padding:20px;">Aucun chant</div>' : ''}
          </div>
          ${actionButtons}
        `;

        card.querySelector('[data-action="details"]').onclick = (e) => {
          e.stopPropagation();
          openSunday(sunday.date);
        };

        if (isAdmin) {
          card.querySelector('[data-action="edit"]').onclick = (e) => {
            e.stopPropagation();
            openEditor(sunday.date);
          };
        }

        return card;
      }

      function renderCards() {
        container.innerHTML = '';
        const maxCards = Math.min(3, sortedSundays.length);
        for (let i = 0; i < maxCards; i++) {
          const idx = (currentTinderIndex + i) % sortedSundays.length;
          const card = createCard(sortedSundays[idx], idx);
          if (i === 0) {
            card.style.zIndex = 10;
            card.style.transform = 'scale(1)';
            card.style.opacity = '1';
          } else if (i === 1) {
            card.style.zIndex = 9;
            card.style.transform = 'scale(0.95) translateY(10px)';
            card.style.opacity = '0.7';
          } else {
            card.style.zIndex = 8;
            card.style.transform = 'scale(0.9) translateY(20px)';
            card.style.opacity = '0.4';
          }
          container.appendChild(card);
        }
        counter.textContent = `${currentTinderIndex + 1}/${sortedSundays.length}`;
        if (container.firstElementChild) attachSwipe(container.firstElementChild);
      }

      function attachSwipe(card) {
        if (!card) return;
        let startX = 0, currentX = 0, isDragging = false;

        const onStart = (e) => {
          if (swipeLocked) return;
          isDragging = true;
          startX = e.touches ? e.touches[0].clientX : e.clientX;
          card.style.transition = 'none';
        };

        const onMove = (e) => {
          if (!isDragging) return;
          currentX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
          card.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
        };

        const onEnd = () => {
          if (!isDragging) return;
          isDragging = false;
          card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';

          if (Math.abs(currentX) > 80) {
            swipeLocked = true;
            if (currentX > 0) {
              card.classList.add('swipe-right');
              setTimeout(() => {
                currentTinderIndex = (currentTinderIndex - 1 + sortedSundays.length) % sortedSundays.length;
                swipeLocked = false;
                renderCards();
              }, 300);
            } else {
              card.classList.add('swipe-left');
              setTimeout(() => {
                currentTinderIndex = (currentTinderIndex + 1) % sortedSundays.length;
                swipeLocked = false;
                renderCards();
              }, 300);
            }
          } else {
            card.style.transform = '';
          }
          currentX = 0;
        };

        card.addEventListener('touchstart', onStart, { passive: true });
        card.addEventListener('touchmove', onMove, { passive: true });
        card.addEventListener('touchend', onEnd);
        card.addEventListener('mousedown', onStart);

        const moveHandler = (e) => { if (isDragging) onMove(e); };
        const upHandler = (e) => { if (isDragging) onEnd(); };
        document.addEventListener('mousemove', moveHandler);
        document.addEventListener('mouseup', upHandler);

        const observer = new MutationObserver(() => {
          if (!document.body.contains(card)) {
            document.removeEventListener('mousemove', moveHandler);
            document.removeEventListener('mouseup', upHandler);
            observer.disconnect();
          }
        });
        observer.observe(container, { childList: true });
      }

      $('#prevBtn').onclick = () => {
        if (swipeLocked) return;
        currentTinderIndex = (currentTinderIndex - 1 + sortedSundays.length) % sortedSundays.length;
        renderCards();
      };

      $('#nextBtn').onclick = () => {
        if (swipeLocked) return;
        currentTinderIndex = (currentTinderIndex + 1) % sortedSundays.length;
        renderCards();
      };

      renderCards();

      const actionsDiv = document.createElement('div');
      let quickActions = '';
      if (isAdmin) {
        quickActions = `
          <h3 class="section">Actions rapides</h3>
          <div class="grid g3">
            <div class="card clickable" onclick="openNewSunday()">
              <div style="font-size:20px;margin-bottom:8px">➕</div>
              <div style="font-weight:600;margin-bottom:4px">Nouveau dimanche</div>
              <div style="font-size:12px;color:var(--text-2)">Créer un programme</div>
            </div>
            <div class="card clickable" onclick="document.querySelector('[data-view=projection]').click()">
              <div style="font-size:20px;margin-bottom:8px">🖥️</div>
              <div style="font-weight:600;margin-bottom:4px">Projection</div>
              <div style="font-size:12px;color:var(--text-2)">Mode culte</div>
            </div>
          </div>
        `;
      } else {
        quickActions = `
          <h3 class="section">Actions rapides</h3>
          <div class="grid g3">
            <div class="card clickable" onclick="document.querySelector('[data-view=projection]').click()">
              <div style="font-size:20px;margin-bottom:8px">🖥️</div>
              <div style="font-weight:600;margin-bottom:4px">Projection</div>
              <div style="font-size:12px;color:var(--text-2)">Mode culte</div>
            </div>
          </div>
        `;
      }
      actionsDiv.innerHTML = quickActions;
      view.appendChild(actionsDiv);
    }

    /* ===== DIMANCHES ===== */
    function renderSundays(view) {
      view.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap">
          <div>
            <h2 class="page-title">Dimanches</h2>
            <p class="page-sub" style="margin-bottom:0">${STATE.sundays.length} programmes</p>
          </div>
          ${isAdmin ? '<button class="btn btn-primary btn-sm" onclick="openNewSunday()">+ Nouveau</button>' : ''}
        </div>
        <div class="field">
          <input type="search" id="filterQ" placeholder="Rechercher un titre, chantre ou date...">
        </div>
        <div id="sundayList"></div>
      `;

      const draw = () => {
        const q = ($('#filterQ').value || '').toLowerCase().trim();
        const sorted = [...STATE.sundays].sort((a, b) => a.date.localeCompare(b.date));
        const list = sorted.filter(s => {
          if (!q) return true;
          if (s.date.includes(q)) return true;
          const dateFr = fmtDate(s.date).toLowerCase();
          if (dateFr.includes(q)) return true;
          return [...(s.adoration || []), ...(s.louange || [])].some(x =>
            (x.title || '').toLowerCase().includes(q) || (x.singer || '').toLowerCase().includes(q)
          );
        });

        $('#sundayList').innerHTML = list.length === 0
          ? `<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Aucun résultat</div>`
          : list.map(s => {
              const singers = [...new Set([...(s.adoration || []), ...(s.louange || [])].map(x => x.singer))];
              return `
                <div class="scard" style="margin-bottom:10px" onclick="openSunday('${s.date}')">
                  <div class="date">${fmtDate(s.date)}</div>
                  <div class="pills">
                    <span class="pill pill-a">${(s.adoration || []).length}A</span>
                    <span class="pill pill-l">${(s.louange || []).length}L</span>
                  </div>
                  <div class="singers">${esc(singers.join(' · '))}</div>
                </div>
              `;
            }).join('');
      };

      $('#filterQ').addEventListener('input', draw);
      draw();
    }

    /* ===== CALENDRIER ===== */
    function renderCalendar(view) {
      view.innerHTML = `
        <h2 class="page-title">Calendrier</h2>
        <p class="page-sub">Touchez un dimanche doré</p>
        <div class="cal-grid" id="calGrid"></div>
      `;

      const byMonth = {};
      STATE.sundays.forEach(s => {
        const k = s.date.slice(0, 7);
        if (!byMonth[k]) byMonth[k] = [];
        byMonth[k].push(s);
      });

      const keys = Object.keys(byMonth).sort();

      $('#calGrid').innerHTML = keys.map(k => {
        const [y, m] = k.split('-').map(Number);
        const md = new Date(y, m - 1, 1);
        const title = md.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        const first = new Date(y, m - 1, 1).getDay();
        const last = new Date(y, m, 0).getDate();
        const hasDates = new Set(byMonth[k].map(s => Number(s.date.slice(8, 10))));

        let cells = ['D', 'L', 'M', 'M', 'J', 'V', 'S'].map(d => `<div class="day day-dow">${d}</div>`).join('');
        for (let i = 0; i < first; i++) cells += '<div></div>';
        for (let d = 1; d <= last; d++) {
          if (hasDates.has(d)) {
            const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            cells += `<div class="day has" onclick="openSunday('${iso}')">${d}</div>`;
          } else {
            cells += `<div class="day">${d}</div>`;
          }
        }
        return `<div class="month-card"><div class="month-title">${title}</div><div class="mgrid">${cells}</div></div>`;
      }).join('');
    }

    /* ===== PAR CHANTRE ===== */
    function renderBySinger(view) {
      const allSingers = new Set(STATE.singers);
      STATE.sundays.forEach(s => {
        [...(s.adoration || []), ...(s.louange || [])].forEach(x => {
          if (x.singer) allSingers.add(x.singer);
        });
      });
      const singersList = [...allSingers];

      view.innerHTML = `
        <h2 class="page-title">Par chantre</h2>
        <p class="page-sub">Affectations individuelles</p>
        <div class="singer-grid" id="singerGrid"></div>
        <div id="singerContent" style="margin-top:24px"></div>
      `;

      const grid = $('#singerGrid');
      const content = $('#singerContent');

      grid.innerHTML = singersList.map(name => {
        const count = STATE.sundays.reduce((acc, s) => {
          return acc + [...(s.adoration || []), ...(s.louange || [])].filter(x => x.singer === name).length;
        }, 0);
        return `<div class="singer-badge" data-singer="${esc(name)}">${esc(name)}<span class="count">${count}</span></div>`;
      }).join('');

      const badges = $$('.singer-badge');
      if (badges.length > 0) {
        badges[0].classList.add('active');
        drawSingerContent(badges[0].dataset.singer);
      }

      badges.forEach(b => {
        b.addEventListener('click', () => {
          badges.forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          drawSingerContent(b.dataset.singer);
        });
      });

      function drawSingerContent(name) {
        const list = STATE.sundays.map(s => ({
          date: s.date,
          songs: [...(s.adoration || []).map(x => ({ ...x, cat: 'a' })), ...(s.louange || []).map(x => ({ ...x, cat: 'l' }))]
            .filter(x => x.singer === name)
        })).filter(s => s.songs.length > 0).sort((a, b) => a.date.localeCompare(b.date));

        const totalSongs = list.reduce((acc, s) => acc + s.songs.length, 0);

        content.innerHTML = `
          <div class="grid g4" style="margin-bottom:16px">
            <div class="stat"><div class="n">${list.length}</div><div class="l">Dimanches</div></div>
            <div class="stat"><div class="n">${totalSongs}</div><div class="l">Chants</div></div>
          </div>
          ${list.length === 0 ? '<div class="empty">Aucune affectation</div>' : list.map(s => `
            <div class="card" style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px">
                <div style="font-weight:600;font-size:14px">${fmtDate(s.date)}</div>
                <button class="btn btn-ghost btn-sm" onclick="openSunday('${s.date}')">Voir →</button>
              </div>
              ${s.songs.map(x => `
                <div style="padding:8px 0;border-top:1px solid var(--border)">
                  <div style="font-size:10px;color:${x.cat === 'a' ? 'var(--gold)' : 'var(--blue)'};font-weight:700;letter-spacing:.06em;margin-bottom:3px">${x.cat === 'a' ? 'ADORATION' : 'LOUANGE'}</div>
                  <div style="font-size:13px;color:var(--text)">${esc(x.title)}</div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        `;
      }
    }

    /* ===== RECHERCHE ===== */
    function renderSearch(view) {
      view.innerHTML = `
        <h2 class="page-title">Recherche</h2>
        <p class="page-sub">Trouver un chant ou un chantre</p>
        <div class="field">
          <input type="search" id="searchQ" placeholder="🔍 Titre, chantre, date...">
        </div>
        <div id="searchResults"></div>
      `;

      let searchTimer;
      const draw = () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          const q = ($('#searchQ')?.value || '').toLowerCase().trim();
          const results = $('#searchResults');
          if (!results) return;
          if (!q) {
            results.innerHTML = '<div class="empty">Tapez pour rechercher</div>';
            return;
          }
          const hits = [];
          STATE.sundays.forEach(s => {
            [...(s.adoration || []).map(x => ({ ...x, cat: 'Adoration' })), ...(s.louange || []).map(x => ({ ...x, cat: 'Louange' }))].forEach(x => {
              const dateFr = fmtDate(s.date).toLowerCase();
              if ((x.title || '').toLowerCase().includes(q) || (x.singer || '').toLowerCase().includes(q) || dateFr.includes(q) || s.date.includes(q)) {
                hits.push({ ...x, date: s.date });
              }
            });
          });
          results.innerHTML = hits.length === 0
            ? '<div class="empty">Aucun résultat</div>'
            : hits.map(h => `
                <div class="card" style="margin-bottom:10px" onclick="openSunday('${h.date}')">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">
                    <span class="pill ${h.cat === 'Adoration' ? 'pill-a' : 'pill-l'}">${h.cat}</span>
                    <span style="font-size:11px;color:var(--text-3)">${fmtDate(h.date)}</span>
                  </div>
                  <div style="font-weight:500;font-size:14px">${esc(h.title)}</div>
                  <div style="font-size:12px;color:var(--gold);margin-top:4px">${esc(h.singer)}</div>
                </div>
              `).join('');
        }, 150);
      };

      $('#searchQ').addEventListener('input', draw);
      draw();
    }

    /* ===== PROJECTION ===== */
    function renderProjection(view, dateOverride) {
      const today = new Date().toISOString().slice(0, 10);
      const defaultDate = projectionDate || STATE.sundays.find(s => s.date >= today)?.date || STATE.sundays[0]?.date;
      const date = dateOverride || defaultDate;
      projectionDate = date;

      if (!STATE.sundays.length) {
        view.innerHTML = '<div class="empty">Aucun dimanche à projeter</div>';
        return;
      }

      view.innerHTML = `
        <h2 class="page-title">Projection</h2>
        <p class="page-sub">Mode culte plein écran</p>
        <div class="field">
          <select id="projSel">
            ${STATE.sundays.map(s => `<option value="${s.date}" ${s.date === date ? 'selected' : ''}>${fmtDate(s.date)}</option>`).join('')}
          </select>
        </div>
        <div id="projContent"></div>
      `;

      const draw = () => {
        const d = $('#projSel').value;
        projectionDate = d;
        const s = STATE.sundays.find(x => x.date === d);
        if (!s) return;
        const singers = [...new Set([...(s.adoration || []), ...(s.louange || [])].map(x => x.singer))];

        $('#projContent').innerHTML = `
          <div class="proj">
            <h1>Abraham Berne <span class="gold">myGod</span></h1>
            <div class="date">${fmtDate(s.date)}</div>
            <div class="singers-line">${singers.map(esc).join(' · ')}</div>
            <h2>ADORATION</h2>
            ${(s.adoration || []).map(x => `<div class="song-block"><div class="title">${esc(x.title)}</div><div class="singer">— ${esc(x.singer)}</div></div>`).join('')}
            <h2>LOUANGE</h2>
            ${(s.louange || []).map(x => `<div class="song-block"><div class="title">${esc(x.title)}</div><div class="singer">— ${esc(x.singer)}</div></div>`).join('')}
          </div>
        `;
      };

      $('#projSel').addEventListener('change', draw);
      draw();
    }

    /* ===== OPEN SUNDAY MODAL ===== */
    window.openSunday = function (date) {
      const s = STATE.sundays.find(x => x.date === date);
      if (!s) return;
      const singers = [...new Set([...(s.adoration || []), ...(s.louange || [])].map(x => x.singer))];

      const songRow = (song, cat) => {
        const id = ytId(song.url);
        const thumb = ytThumb(song.url);
        return `
          <div class="song-item">
            ${thumb
              ? `<div class="song-thumb"><img src="${thumb}" alt="" onerror="this.parentElement.innerHTML='🎵'"></div>`
              : `<div class="song-thumb">🎵</div>`}
            <div class="song-info">
              <div class="song-title">${esc(song.title)}</div>
              <div class="song-meta">
                <span class="singer">${esc(song.singer)}</span>
                <span>${cat === 'a' ? 'Adoration' : 'Louange'}</span>
              </div>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0">
              ${id ? `<a href="${esc(song.url)}" target="_blank" rel="noopener" class="btn btn-primary btn-icon" title="Ouvrir sur YouTube">▶</a>` : `<span class="btn btn-ghost btn-icon" style="opacity:0.5">✕</span>`}
              ${isAdmin ? `<button class="btn btn-ghost btn-icon" data-edit-cat="${cat}" data-edit-title="${esc(song.title)}" title="Modifier">✎</button>` : ''}
            </div>
          </div>
        `;
      };

      openModal(`
        <div class="modal-header">
          <h3>${fmtDate(s.date)}</h3>
          <button class="btn-close" onclick="closeModal()" aria-label="Fermer">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div style="font-size:13px;color:var(--text-2);margin-bottom:16px">
          <b>Chantres :</b> ${singers.map(esc).join(' · ')}
        </div>
        <h3 class="section" style="margin-top:8px">Adoration</h3>
        ${(s.adoration || []).map(x => songRow(x, 'a')).join('') || '<div class="empty">Aucun chant</div>'}
        <h3 class="section">Louange</h3>
        ${(s.louange || []).map(x => songRow(x, 'l')).join('') || '<div class="empty">Aucun chant</div>'}
        <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">
          ${isAdmin ? `<button class="btn btn-primary" style="flex:1" onclick="openEditor('${date}')">✎ Modifier le programme</button>` : ''}
          <button class="btn btn-ghost" onclick="projFromModal('${date}')">🖥️ Projeter</button>
        </div>
      `);

      $$('#modalBody [data-edit-cat]').forEach(btn => {
        btn.onclick = () => {
          openEditor(date);
        };
      });
    };

    window.projFromModal = function (date) {
      projectionDate = date;
      closeModal();
      $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === 'projection'));
      currentView = 'projection';
      render();
    };

    window.closeModal = closeModal;

    /* ===== EDITOR ===== */
    window.openNewSunday = function () {
      if (!isAdmin) return;
      const today = new Date();
      const daysUntilSunday = (7 - today.getDay()) % 7 || 7;
      const nextSun = new Date(today);
      nextSun.setDate(today.getDate() + daysUntilSunday);
      const iso = nextSun.toISOString().slice(0, 10);
      openEditor(null, iso);
    };

    window.openEditor = function (date, suggestedDate) {
      if (!isAdmin) return;

      const isNew = !date;
      const s = isNew ? { date: suggestedDate || new Date().toISOString().slice(0, 10), adoration: [], louange: [] } : clone(STATE.sundays.find(x => x.date === date));

      if (!s) return;

      window._editorState = s;
      window._editorOriginalDate = date;

      openModal(`
        <div class="modal-header">
          <h3>${isNew ? 'Nouveau dimanche' : 'Modifier le programme'}</h3>
          <button class="btn-close" onclick="closeModal()" aria-label="Fermer">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <div class="field">
          <label>Date du dimanche</label>
          <input type="date" id="edDate" value="${s.date}">
        </div>
        <h3 class="section" style="margin-top:20px" id="edCountA">Adoration (${s.adoration.length})</h3>
        <div id="edAdoration"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="edAddSong('a')">+ Ajouter un chant d'adoration</button>
        <h3 class="section" id="edCountL">Louange (${s.louange.length})</h3>
        <div id="edLouange"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="edAddSong('l')">+ Ajouter un chant de louange</button>
        <div style="margin-top:24px;display:flex;gap:8px">
          <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Annuler</button>
          ${!isNew ? `<button class="btn btn-danger" onclick="deleteSunday('${s.date}')">Supprimer</button>` : ''}
          <button class="btn btn-primary" style="flex:1.5" onclick="saveSunday(${isNew ? 'null' : `'${s.date}'`})">${isNew ? 'Créer' : 'Enregistrer'}</button>
        </div>
      `);

      drawEditorLists();

      function drawEditorLists() {
        const s = window._editorState;
        const renderList = (arr, cat) => arr.map((x, i) => `
          <div class="song-item" style="padding:10px">
            <div class="song-info">
              <input data-cat="${cat}" data-idx="${i}" data-field="title" value="${esc(x.title)}" style="margin-bottom:6px;font-size:13px;padding:8px 10px" placeholder="Titre">
              <div style="display:flex;gap:6px">
                <div class="custom-select" id="select_${cat}_${i}">
                  <button class="custom-select-trigger" data-toggle-select="${cat}_${i}" type="button">
                    ${esc(x.singer)}
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                  </button>
                  <div class="custom-select-options">
                    ${STATE.singers.map(n => `<div class="custom-option ${n === x.singer ? 'selected' : ''}" data-select-singer="${esc(n)}" data-cat="${cat}" data-idx="${i}">${esc(n)}</div>`).join('')}
                    <div class="custom-option other" data-custom-singer data-cat="${cat}" data-idx="${i}">+ Autre chantre...</div>
                  </div>
                </div>
                <input data-cat="${cat}" data-idx="${i}" data-field="url" value="${esc(x.url || '')}" placeholder="https://youtu.be/..." style="margin-top:6px;font-size:12px;padding:8px 10px">
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
              <button class="btn btn-ghost btn-icon" style="color:var(--gold)" data-dup-cat="${cat}" data-dup-idx="${i}" title="Dupliquer vers un autre dimanche">📋</button>
              <button class="btn btn-ghost btn-icon" style="color:var(--red)" data-remove-all-cat="${cat}" data-remove-all-idx="${i}" title="Supprimer partout">🗑️</button>
              <button class="btn btn-ghost btn-icon" style="color:var(--red)" data-remove-cat="${cat}" data-remove-idx="${i}" title="Retirer de ce dimanche">✕</button>
            </div>
          </div>
        `).join('');

        $('#edAdoration').innerHTML = renderList(s.adoration, 'a') || '<div class="empty" style="padding:12px">Aucun chant</div>';
        $('#edLouange').innerHTML = renderList(s.louange, 'l') || '<div class="empty" style="padding:12px">Aucun chant</div>';

        const countA = $('#edCountA');
        const countL = $('#edCountL');
        if (countA) countA.textContent = `Adoration (${s.adoration.length})`;
        if (countL) countL.textContent = `Louange (${s.louange.length})`;

        $$('#modalBody input[data-field]').forEach(el => {
          el.oninput = el.onchange = (e) => {
            const cat = e.target.dataset.cat;
            const idx = Number(e.target.dataset.idx);
            const field = e.target.dataset.field;
            const arr = cat === 'a' ? s.adoration : s.louange;
            if (arr[idx]) arr[idx][field] = e.target.value;
          };
        });

        $$('#modalBody [data-toggle-select]').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const key = btn.dataset.toggleSelect;
            $$('#modalBody .custom-select.open').forEach(el => {
              if (el.id !== `select_${key}`) el.classList.remove('open');
            });
            const el = document.getElementById(`select_${key}`);
            if (el) el.classList.toggle('open');
          };
        });

        $$('#modalBody [data-select-singer]').forEach(opt => {
          opt.onclick = (e) => {
            e.stopPropagation();
            selectSinger(opt.dataset.cat, Number(opt.dataset.idx), opt.dataset.selectSinger);
          };
        });

        $$('#modalBody [data-custom-singer]').forEach(opt => {
          opt.onclick = (e) => {
            e.stopPropagation();
            promptCustomSinger(opt.dataset.cat, Number(opt.dataset.idx));
          };
        });

        $$('#modalBody [data-dup-cat]').forEach(btn => {
          btn.onclick = () => edDuplicateSong(btn.dataset.dupCat, Number(btn.dataset.dupIdx));
        });

        $$('#modalBody [data-remove-all-cat]').forEach(btn => {
          btn.onclick = () => edRemoveSongEverywhere(btn.dataset.removeAllCat, Number(btn.dataset.removeAllIdx));
        });

        $$('#modalBody [data-remove-cat]').forEach(btn => {
          btn.onclick = () => edRemoveSong(btn.dataset.removeCat, Number(btn.dataset.removeIdx));
        });

        const edDate = $('#edDate');
        if (edDate) {
          edDate.onchange = (e) => {
            window._editorState.date = e.target.value;
          };
        }
      }

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.custom-select')) {
          $$('.custom-select.open').forEach(el => el.classList.remove('open'));
        }
      });
    };

    window.toggleCustomSelect = function (cat, idx) {
      const el = document.getElementById(`select_${cat}_${idx}`);
      if (el) el.classList.toggle('open');
    };

    window.selectSinger = function (cat, idx, name) {
      const s = window._editorState;
      if (!s) return;
      const arr = cat === 'a' ? s.adoration : s.louange;
      if (arr[idx]) {
        arr[idx].singer = name;
        if (name && !STATE.singers.includes(name)) STATE.singers.push(name);
      }

      const el = document.getElementById(`select_${cat}_${idx}`);
      if (el) el.classList.remove('open');

      drawEditorLists();
    };

    window.promptCustomSinger = function (cat, idx) {
      const s = window._editorState;
      if (!s) return;
      const arr = cat === 'a' ? s.adoration : s.louange;
      if (!arr[idx]) return;

      openModal(`
        <div class="modal-header">
          <h3>Chantre invité·e</h3>
          <button class="btn-close" onclick="reopenEditor()" aria-label="Fermer">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>
        <p style="font-size:14px;color:var(--text-2);margin-bottom:16px">Entrez le nom du chantre invité·e :</p>
        <div class="field">
          <input type="text" id="customSingerName" placeholder="Nom du chantre" style="font-size:16px;padding:12px;">
        </div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="btn btn-ghost" style="flex:1" onclick="reopenEditor()">Annuler</button>
          <button class="btn btn-primary" style="flex:1" onclick="validateCustomSinger('${cat}', ${idx})">Valider</button>
        </div>
      `);

      setTimeout(() => {
        const inp = $('#customSingerName');
        if (inp && document.body.contains(inp)) {
          inp.focus();
          inp.addEventListener('keypress', (e) => { if (e.key === 'Enter') validateCustomSinger(cat, idx); });
        }
      }, 100);
    };

    window.reopenEditor = function () {
      const s = window._editorState;
      const orig = window._editorOriginalDate;
      if (s) {
        openModalFromState(s, orig);
      } else {
        closeModal();
      }
    };

    function openModalFromState(s, originalDate) {
      const isNew = !originalDate;
      openModal(`
        <div class="modal-header">
          <h3>${isNew ? 'Nouveau dimanche' : 'Modifier le programme'}</h3>
          <button class="btn-close" onclick="closeModal()" aria-label="Fermer">
            <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

          <label>Date du dimanche</label>
          <input type="date" id="edDate" value="${s.date}">
        </div>
        <h3 class="section" style="margin-top:20px" id="edCountA">Adoration (${s.adoration.length})</h3>
        <div id="edAdoration"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="edAddSong('a')">+ Ajouter un chant d'adoration</button>

        <div id="edLouange"></div>

          <button class="btn btn-primary" style="flex:1.5" onclick="saveSunday(${isNew ? 'null' : `'${originalDate}'`})">${isNew ? 'Créer' : 'Enregistrer'}</button>
        </div>
      `);

      drawEditorListsFromState(s);

      function drawEditorListsFromState(s) {

                  </button>

                    <div class="custom-option other" data-custom-singer data-cat="${cat}" data-idx="${i}">+ Autre chantre...</div>
                  </div>
                </div>
                <input data-cat="${cat}" data-idx="${i}" data-field="url" value="${esc(x.url || '')}" placeholder="https://youtu.be/..." style="margin-top:6px;font-size:12px;padding:8px 10px">
              </div>
            </div>
            <div style="display:flex;flex-direction:column;gap:4px;">
              <button class="btn btn-ghost btn-icon" style="color:var(--gold)" data-dup-cat="${cat}" data-dup-idx="${i}" title="Dupliquer vers un autre dimanche">📋</button>
              <button class="btn btn-ghost btn-icon" style="color:var(--red)" data-remove-all-cat="${cat}" data-remove-all-idx="${i}" title="Supprimer partout">🗑️</button>
              <button class="btn btn-ghost btn-icon" style="color:var(--red)" data-remove-cat="${cat}" data-remove-idx="${i}" title="Retirer de ce dimanche">✕</button>
            </div>
          </div>
        `).join('');

        $('#edAdoration').innerHTML = renderList(s.adoration, 'a') || '<div class="empty" style="padding:12px">Aucun chant</div>';
        $('#edLouange').innerHTML = renderList(s.louange, 'l') || '<div class="empty" style="padding:12px">Aucun chant</div>';

        const countA = $('#edCountA');
        const countL = $('#edCountL');
        if (countA) countA.textContent = `Adoration (${s.adoration.length})`;

        $$('#modalBody input[data-field]').forEach(el => {
          el.oninput = el.onchange = (e) => {
            const cat = e.target.dataset.cat;
            const idx = Number(e.target.dataset.idx);

            const arr = cat === 'a' ? s.adoration : s.louange;
            if (arr[idx]) arr[idx][field] = e.target.value;
          };

        $$('#modalBody [data-toggle-select]').forEach(btn => {
          btn.onclick = (e) => {
            e.stopPropagation();
            const key = btn.dataset.toggleSelect;
            $$('#modalBody .custom-select.open').forEach(el => {
              if (el.id !== `select_${key}`) el.classList.remove('open');
            });
            const el = document.getElementById(`select_${key}`);
            if (el) el.classList.toggle('open');
          };

        $$('#modalBody [data-select-singer]').forEach(opt => {

          btn.onclick = () => edDuplicateSong(btn.dataset.dupCat, Number(btn.dataset.dupIdx));
