<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0a0c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Abraham Berne myGod</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ===== RESET & TOKENS ===== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0a0a0c;
      --bg-1: #101014;
      --bg-2: #16161c;
      --bg-3: #1e1e26;
      --bg-4: #282833;
      --border: rgba(255,255,255,.07);
      --border-strong: rgba(255,255,255,.14);
      --text: #f5f5f7;
      --text-2: #a8a8b3;
      --text-3: #6a6a75;
      --gold: #e8c86a;
      --gold-2: #d4a935;
      --gold-glow: rgba(232,200,106,.25);
      --red: #f87171;
      --green: #4ade80;
      --blue: #60a5fa;
      --radius-s: 10px;
      --radius: 16px;
      --radius-l: 22px;
      --shadow: 0 4px 24px rgba(0,0,0,.4);
      --shadow-lg: 0 12px 48px rgba(0,0,0,.6);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    html { height: 100%; }
    body {
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      font-size: 15px;
      line-height: 1.5;
      background-image:
        radial-gradient(ellipse 80% 40% at 50% -10%, rgba(232,200,106,.08), transparent),
        radial-gradient(ellipse 60% 30% at 100% 100%, rgba(212,169,53,.04), transparent);
    }
    .hidden { display: none !important; }
    .gold { color: var(--gold); }

    /* ===== HEADER ===== */
    header {
      flex-shrink: 0;
      z-index: 40;
      padding: calc(14px + var(--safe-top)) 16px 14px;
      background: rgba(16, 16, 20, 0.75);
      backdrop-filter: blur(24px) saturate(150%);
      -webkit-backdrop-filter: blur(24px) saturate(150%);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.3s ease;
    }
    .header-inner {
      max-width: 1100px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo {
      width: 42px; height: 42px; border-radius: 14px;
      display: grid; place-items: center;
      background: linear-gradient(145deg, #f0d580, #b88f1a);
      color: #0a0a0c; font-weight: 800; font-size: 20px;
      box-shadow: 0 4px 16px rgba(212,169,53,.3), inset 0 1px 0 rgba(255,255,255,.4);
      flex-shrink: 0;
    }
    .brand-text { display: flex; flex-direction: column; }
    .brand h1 { font-size: 16px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; }
    .brand .tag { font-size: 10px; color: var(--text-3); font-weight: 600; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.05em; }
    
    .header-actions { display: flex; align-items: center; gap: 10px; }
    
    .btn-lock {
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      color: var(--text-2);
      border-radius: 50%;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
      position: relative;
      overflow: hidden;
    }
    .btn-lock:hover { background: rgba(255,255,255,.08); color: var(--text); }
    .btn-lock.locked {
      background: rgba(232, 200, 106, 0.15);
      border-color: rgba(232, 200, 106, 0.4);
      color: var(--gold);
      box-shadow: 0 0 20px rgba(232, 200, 106, 0.15);
    }
    
    .btn-reset-icon {
      background: transparent;
      border: none;
      color: var(--text-3);
      width: 40px; height: 40px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: all 0.2s;
      border-radius: 50%;
    }
    .btn-reset-icon:hover { background: rgba(248,113,113,.1); color: var(--red); }

    /* ===== MAIN CONTENT ===== */
    .scroll-container {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding-bottom: calc(90px + var(--safe-bottom));
    }
    main { 
      max-width: 1100px; 
      margin: 0 auto; 
      padding: 20px 16px 0 16px; 
      animation: fadeIn .3s ease-out; 
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    
    h2.page-title { font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-bottom: 4px; }
    p.page-sub { color: var(--text-2); font-size: 14px; margin-bottom: 24px; }
    h3.section {
      font-size: 15px; font-weight: 700; color: var(--text);
      margin: 28px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    h3.section:before {
      content: ""; width: 3px; height: 16px;
      background: var(--gold); border-radius: 2px;
    }

    /* ===== CARDS & UTILS ===== */
    .card {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; transition: all .2s;
    }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: var(--border-strong); background: var(--bg-3); }
    .card.clickable:active { transform: scale(.985); }
    .grid { display: grid; gap: 12px; }
    .g3 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    .g4 { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

    /* ===== STATS ===== */
    .stat {
      background: linear-gradient(160deg, var(--bg-2), var(--bg-3));
      border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; text-align: center; position: relative; overflow: hidden;
    }
    .stat:before {
      content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      opacity: .6;
    }
    .stat .n { font-size: 26px; font-weight: 800; color: var(--gold); letter-spacing: -.02em; line-height: 1.1; }
    .stat .l { font-size: 11px; color: var(--text-2); margin-top: 6px; font-weight: 500; }

    /* ===== SUNDAY CARD (LIST) ===== */
    .scard {
      cursor: pointer; padding: 16px; background: var(--bg-2);
      border: 1px solid var(--border); border-radius: var(--radius);
      transition: all .2s; position: relative; overflow: hidden;
    }
    .scard::after {
      content: ""; position: absolute; top: 0; left: 0; bottom: 0; width: 3px;
      background: linear-gradient(180deg, var(--gold), transparent); opacity: .6;
    }
    .scard:hover { border-color: var(--gold-glow); background: var(--bg-3); transform: translateY(-2px); }
    .scard:active { transform: scale(.99); }
    .scard .date { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: var(--text); }
    .scard .pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
    .pill {
      padding: 3px 9px; border-radius: 20px; font-size: 10px;
      font-weight: 600; letter-spacing: .02em; text-transform: uppercase;
    }
    .pill-a { background: rgba(232,200,106,.15); color: var(--gold); }
    .pill-l { background: rgba(96,165,250,.15); color: var(--blue); }
    .scard .singers { font-size: 12px; color: var(--text-2); line-height: 1.4; font-weight: 400; }

    /* ===== TINDER CARDS (HOME) ===== */
    .tinder-container {
      position: relative; width: 100%; max-width: 400px; margin: 0 auto 24px;
      height: 460px; perspective: 1000px;
    }
    .tinder-card {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius-l); padding: 20px;
      display: flex; flex-direction: column;
      box-shadow: var(--shadow-lg); cursor: grab;
      transition: transform .3s ease, opacity .3s ease;
      transform-origin: center bottom;
      user-select: none;
      will-change: transform;
    }
    .tinder-card:active { cursor: grabbing; }
    .tinder-card.swipe-left { transform: translateX(-120%) rotate(-15deg); opacity: 0; }
    .tinder-card.swipe-right { transform: translateX(120%) rotate(15deg); opacity: 0; }
    
    .tinder-card .card-date { font-size: 20px; font-weight: 700; color: var(--gold); margin-bottom: 6px; letter-spacing: -0.01em; }
    .tinder-card .card-singers { font-size: 13px; color: var(--text-2); margin-bottom: 16px; font-weight: 500; line-height: 1.4; }
    
    .tinder-card .card-songs { 
      flex: 1; 
      overflow-y: auto; 
      padding-right: 8px; 
      margin-right: -8px; 
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .tinder-card .card-songs::-webkit-scrollbar { width: 4px; }
    .tinder-card .card-songs::-webkit-scrollbar-thumb { background: var(--bg-4); border-radius: 4px; }
    
    .tinder-card .song-preview { 
      font-size: 13px; 
      padding-bottom: 10px; 
      border-bottom: 1px solid var(--border); 
      line-height: 1.45; 
      font-weight: 400; 
      color: var(--text);
      text-align: left;
    }
    .tinder-card .song-preview:last-child { border-bottom: none; padding-bottom: 0; }
    
    .tinder-card .card-actions { margin-top: 16px; display: flex; gap: 8px; flex-shrink: 0; }
    .tinder-card .card-actions .btn { flex: 1; }
    
    .tinder-nav {
      display: flex; justify-content: center; align-items: center; gap: 16px;
      margin-top: -10px; margin-bottom: 20px; color: var(--text-3); font-size: 13px;
    }
    .tinder-nav button {
      background: var(--bg-2); border: 1px solid var(--border); color: var(--text);
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center; font-size: 18px; transition: all .2s;
    }
    .tinder-nav button:hover { background: var(--bg-3); border-color: var(--gold); }
    .tinder-nav button:active { transform: scale(.9); }
    .tinder-nav .counter { font-weight: 600; min-width: 60px; text-align: center; }

    /* ===== FORMS ===== */
    .field { margin-bottom: 14px; }
    .field label { display: block; font-size: 12px; color: var(--text-2); margin-bottom: 6px; font-weight: 500; letter-spacing: .01em; }
    input, select, textarea {
      width: 100%; padding: 12px 14px; background: var(--bg-1);
      border: 1px solid var(--border); border-radius: var(--radius-s);
      color: var(--text); font-size: 14px; font-family: inherit; transition: all .15s;
      font-weight: 400;
    }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--gold); background: var(--bg-2);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }

    /* ===== BUTTONS ===== */
    .btn {
      border: none; border-radius: 12px; padding: 12px 20px;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: all .15s; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center;
      gap: 8px; text-decoration: none; line-height: 1.2; min-height: 44px;
    }
    .btn:active { transform: scale(.97); }
    .btn-primary {
      background: linear-gradient(160deg, #f0d580, var(--gold-2));
      color: #0a0a0c;
      box-shadow: 0 4px 16px rgba(212,169,53,.3), inset 0 1px 0 rgba(255,255,255,.3);
    }
    .btn-primary:hover { filter: brightness(1.05); }
    .btn-ghost { background: var(--bg-3); color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-4); }
    .btn-danger { background: rgba(248,113,113,.1); color: var(--red); border: 1px solid rgba(248,113,113,.2); }
    .btn-danger:hover { background: rgba(248,113,113,.15); }
    .btn-sm { padding: 8px 14px; font-size: 12px; min-height: 36px; border-radius: 10px; }
    .btn-icon {
      padding: 0; width: 40px; height: 40px; border-radius: 10px;
      display: grid; place-items: center;
    }
    .btn-icon svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    /* ===== SONG ROW ===== */
    .song-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px; border-radius: 12px; background: var(--bg-1);
      border: 1px solid var(--border); margin-bottom: 8px; transition: all .15s;
    }
    .song-thumb {
      width: 56px; height: 56px; border-radius: 8px; background: var(--bg-3);
      flex-shrink: 0; object-fit: cover; display: grid; place-items: center;
      color: var(--text-3); font-size: 20px;
    }
    .song-info { flex: 1; min-width: 0; }
    .song-title {
      font-size: 14px; font-weight: 500; color: var(--text); margin-bottom: 3px;
      overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
      -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.35;
    }
    .song-meta { font-size: 11px; color: var(--text-2); display: flex; gap: 8px; flex-wrap: wrap; }
    .song-meta .singer { color: var(--gold); font-weight: 500; }

    /* ===== MODAL ===== */
    .modal {
      position: fixed; inset: 0; z-index: 100; display: flex;
      align-items: flex-end; justify-content: center;
      background: rgba(0,0,0,.7); backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px); animation: modalBg .2s; overflow: hidden;
    }
    @keyframes modalBg { from { opacity: 0; } to { opacity: 1; } }
    .modal-sheet {
      background: var(--bg-2); border-radius: 24px 24px 0 0;
      width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
      padding: 8px 20px calc(24px + var(--safe-bottom));
      box-shadow: var(--shadow-lg);
      animation: sheetUp .3s cubic-bezier(.2,.9,.3,1.2);
      position: relative;
      -webkit-overflow-scrolling: touch;
    }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle {
      width: 36px; height: 4px; background: var(--bg-4);
      border-radius: 2px; margin: 0 auto 16px;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; margin-bottom: 16px;
    }
    .modal-header h3 { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: -.01em; flex: 1; }
    .btn-close {
      background: var(--bg-3); border: none; color: var(--text-2);
      width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center; flex-shrink: 0; transition: all .15s;
    }
    .btn-close:hover { background: var(--bg-4); color: var(--text); }
    .btn-close svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2.5; stroke-linecap: round; }

    /* ===== CALENDAR ===== */
    .cal-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
    .month-card { background: var(--bg-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px; }
    .month-title { font-size: 13px; font-weight: 600; color: var(--gold); text-transform: capitalize; margin-bottom: 10px; }
    .mgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
    .dow { font-size: 9px; color: var(--text-3); text-align: center; font-weight: 600; padding: 2px 0; }
    .day {
      aspect-ratio: 1; display: grid; place-items: center; border-radius: 7px;
      font-size: 11px; background: var(--bg-1); color: var(--text-3); font-weight: 500;
    }
    .day.has {
      background: linear-gradient(160deg, var(--gold), var(--gold-2));
      color: #0a0a0c; font-weight: 700; cursor: pointer;
      box-shadow: 0 2px 8px rgba(212,169,53,.3); transition: all .15s;
    }
    .day.has:hover { transform: scale(1.08); }

    /* ===== PROJECTION ===== */
    .proj {
      background: #000; color: #fff; min-height: 80vh; padding: 32px 20px;
      text-align: center; border-radius: var(--radius); margin-top: 16px;
    }
    .proj h1 { font-size: clamp(24px, 5vw, 38px); color: var(--gold); margin-bottom: 6px; font-weight: 800; letter-spacing: -.02em; }
    .proj .date { font-size: clamp(14px, 2.5vw, 18px); color: #ccc; margin-bottom: 24px; }
    .proj .singers-line { font-size: clamp(16px, 3vw, 22px); color: var(--gold); margin-bottom: 32px; font-weight: 600; }
    .proj h2 {
      font-size: clamp(18px, 3.5vw, 24px); color: var(--gold); margin: 32px 0 16px;
      padding-bottom: 10px; border-bottom: 1px solid rgba(232,200,106,.3); letter-spacing: .05em;
    }
    .proj .song-block { margin-bottom: 20px; }
    .proj .song-block .title { font-size: clamp(16px, 3vw, 22px); line-height: 1.4; margin-bottom: 4px; font-weight: 500; }
    .proj .song-block .singer { font-size: clamp(12px, 2vw, 15px); color: var(--gold); font-weight: 600; }

    /* ===== SINGER BADGES ===== */
    .singer-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
    .singer-badge {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: 50px; padding: 10px 20px; font-size: 14px; font-weight: 500;
      cursor: pointer; transition: all .2s; display: flex; align-items: center; gap: 8px;
      color: var(--text);
    }
    .singer-badge:hover { border-color: var(--gold); background: var(--bg-3); }
    .singer-badge.active { background: var(--gold); color: #0a0a0c; border-color: var(--gold); font-weight: 600; }
    .singer-badge .count {
      background: rgba(0,0,0,.2); border-radius: 12px;
      padding: 2px 8px; font-size: 11px; font-weight: 700;
    }
    .singer-badge.active .count { background: rgba(0,0,0,.3); color: #fff; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
      padding: 8px 8px calc(8px + var(--safe-bottom));
      background: rgba(16,16,20,.95);
      backdrop-filter: saturate(180%) blur(24px);
      -webkit-backdrop-filter: saturate(180%) blur(24px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; gap: 2px;
    }
    .nav-item {
      flex: 1; background: none; border: none;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 6px 4px; color: var(--text-3); font-size: 10px; font-weight: 500;
      cursor: pointer; border-radius: 12px; font-family: inherit;
      transition: all .2s; position: relative;
    }
    .nav-item svg {
      width: 22px; height: 22px; stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      transition: transform .2s;
    }
    .nav-item.active { color: var(--gold); font-weight: 600; }
    .nav-item.active svg { transform: scale(1.1); }

    /* ===== RESPONSIVE ===== */
    @media (min-width: 768px) {
      .bottom-nav {
        top: 80px; bottom: auto; border-radius: var(--radius);
        max-width: calc(100% - 32px); margin: 0 16px;
        border: 1px solid var(--border); box-shadow: var(--shadow);
      }
      .scroll-container { padding-bottom: 32px; }
      .nav-item svg { width: 20px; height: 20px; }
      main { padding-top: 80px; }
    }

    /* ===== TOAST ===== */
    .toast {
      position: fixed; bottom: calc(100px + var(--safe-bottom)); left: 50%;
      transform: translateX(-50%); background: var(--bg-3);
      border: 1px solid var(--gold); color: var(--text);
      padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 500;
      z-index: 200; box-shadow: 0 8px 32px rgba(0,0,0,.5);
      animation: toastIn .3s cubic-bezier(.2,.9,.3,1.2); max-width: calc(100% - 32px);
    }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, 16px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* ===== EMPTY ===== */
    .empty { text-align: center; padding: 40px 20px; color: var(--text-3); font-size: 14px; }
    .empty svg { width: 48px; height: 48px; stroke: currentColor; fill: none; stroke-width: 1.5; opacity: .5; margin-bottom: 12px; }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand">
        <div class="logo">A</div>
        <div class="brand-text">
          <h1>Abraham Berne <span class="gold">myGod</span></h1>
          <div class="tag">Programme musical</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-reset-icon" onclick="confirmReset()" title="Réinitialiser les données">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
        </button>
        <button class="btn-lock" id="lockBtn" onclick="promptLock()" title="Déverrouiller pour modifier">
          <svg id="lockIcon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="scroll-container">
    <main id="view"></main>

        if (raw) {
          STATE = JSON.parse(raw);
          if (!STATE.singers || !STATE.sundays) throw new Error();
          return;
        }
      } catch (e) {}
      STATE = { singers: clone(SEED_SINGERS), sundays: clone(SEED_SUNDAYS) };
      save();
    }

    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); } catch (e) {}
    }

      return new Date(iso + 'T00:00:00').toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    }

    function ytId(url) {
      const m = (url || '').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
      return m ? m[1] : null;
    }

    function ytThumb(url) {
      const id = ytId(url);
      return id ? `https://img.youtube.com/vi/${id}/mqdefault.jpg` : null;
    }

    function toast(msg, ms = 2200) {
      const t = $('#toast');
      t.textContent = msg;
      t.classList.remove('hidden');
      clearTimeout(t._t);
      t._t = setTimeout(() => t.classList.add('hidden'), ms);
    }

    function openModal(html) {
      $('#modalBody').innerHTML = html;
      $('#modal').classList.remove('hidden');
    }

    function closeModal() {
      $('#modal').classList.add('hidden');
    }

    $('#modal').addEventListener('click', e => {
      if (e.target.id === 'modal') closeModal();
    });

          </div>

        `);
        
        setTimeout(() => {
          const inp = $('#adminPwd');
          if (inp) {
            inp.focus();
            inp.addEventListener('keypress', (e) => {
              if (e.key === 'Enter') validateLock();
            });
          }
        }, 100);
      }
    };

      const pwd = $('#adminPwd').value;
      if (pwd === ADMIN_PASSWORD) {
        isAdmin = true;
        updateLockIcon();
        closeModal();
        render();
        toast('🔓 Mode édition déverrouillé');
      } else {
        toast('❌ Code incorrect');
        $('#adminPwd').value = '';
        $('#adminPwd').focus();
      }
    };

    function updateLockIcon() {
      const btn = $('#lockBtn');

      if (isAdmin) {
        btn.classList.add('locked');
        icon.innerHTML = '<rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path>';

    function render() {
      closeModal();
      const view = $('#view');
      switch (currentView) {
        case 'home': return renderHome(view);
        case 'sundays': return renderSundays(view);

        case 'singer': return renderBySinger(view);
        case 'search': return renderSearch(view);
        case 'projection': return renderProjection(view);

    }

    /* ===== HOME ===== */
    function renderHome(view) {
      const sorted = [...STATE.sundays].sort((a, b) => a.date.localeCompare(b.date));
      const today = new Date().toISOString().slice(0, 10);
      
      let startIndex = sorted.findIndex(s => s.date >= today);
      if (startIndex === -1) startIndex = sorted.length - 1;
      
      currentTinderIndex = startIndex;

      const songSet = new Set();
      STATE.sundays.forEach(s => {
        [...(s.adoration || []), ...(s.louange || [])].forEach(x => songSet.add(x.title.trim().toLowerCase()));
      });

      view.innerHTML = `

        <p class="page-sub">Programme musical du groupe Abraham Berne</p>

        <div class="grid g4" style="margin-bottom:24px">
          <div class="stat"><div class="n">${STATE.sundays.length}</div><div class="l">Dimanches</div></div>
          <div class="stat"><div class="n">${STATE.singers.length}</div><div class="l">Chantres</div></div>
          <div class="stat"><div class="n">${songSet.size}</div><div class="l">Chants</div></div>
        </div>

        <h3 class="section">Programme du jour</h3>
        <div class="tinder-container" id="tinderContainer"></div>
        <div class="tinder-nav">
          <button id="prevBtn" aria-label="Précédent">←</button>
          <span class="counter" id="tinderCounter">1 / ${sorted.length}</span>
          <button id="nextBtn" aria-label="Suivant">→</button>
        </div>
      `;

      const container = $('#tinderContainer');
      const counter = $('#tinderCounter');
      
      function createCard(sunday, index) {
        const card = document.createElement('div');
        card.className = 'tinder-card';
        card.dataset.index = index;
        
        const actionButtons = isAdmin ? `
          <div class="card-actions">
            <button class="btn btn-ghost btn-sm" data-action="details">Détails</button>
            <button class="btn btn-primary btn-sm" data-action="edit">Modifier</button>
          </div>
        ` : `
          <div class="card-actions">
            <button class="btn btn-ghost btn-sm" data-action="details" style="flex:1">Voir les détails</button>
          </div>
        `;

        card.innerHTML = `
          <div class="card-date">${fmtDate(sunday.date)}</div>
          <div class="card-singers">${[...new Set([...(sunday.adoration || []), ...(sunday.louange || [])].map(x => x.singer))].join(' • ')}</div>
          <div class="card-songs">
            ${(sunday.adoration || []).map(x => `<div class="song-preview">${esc(x.title)}</div>`).join('')}
            ${(sunday.louange || []).map(x => `<div class="song-preview">${esc(x.title)}</div>`).join('')}
            ${(!sunday.adoration || sunday.adoration.length === 0) && (!sunday.louange || sunday.louange.length === 0) ? '<div style="color:var(--text-3);text-align:center;padding:20px;">Aucun chant</div>' : ''}
          </div>
          ${actionButtons}
        `;
        
        card.querySelector('[data-action="details"]').onclick = (e) => {
          e.stopPropagation();
          openSunday(sunday.date);
        };
        
        if (isAdmin) {
          card.querySelector('[data-action="edit"]').onclick = (e) => {
            e.stopPropagation();
            openEditor(sunday.date);
          };
        }
        
        return card;
      }

      function renderCards() {
        container.innerHTML = '';
        const maxCards = 3;
        for (let i = 0; i < maxCards; i++) {
          const idx = (currentTinderIndex + i) % sorted.length;
          const card = createCard(sorted[idx], idx);
          if (i === 0) {
            card.style.zIndex = 10;
            card.style.transform = 'scale(1)';
            card.style.opacity = '1';
          } else if (i === 1) {
            card.style.zIndex = 9;
            card.style.transform = 'scale(0.95) translateY(10px)';
            card.style.opacity = '0.7';
          } else {
            card.style.zIndex = 8;
            card.style.transform = 'scale(0.9) translateY(20px)';
            card.style.opacity = '0.4';
          }
          container.appendChild(card);
        }
        
        counter.textContent = `${currentTinderIndex + 1} / ${sorted.length}`;
        attachSwipe(container.firstElementChild);
      }

      function attachSwipe(card) {
        if (!card) return;
        let startX = 0, currentX = 0, isDragging = false;
        
        const onStart = (e) => {
          isDragging = true;
          startX = e.touches ? e.touches[0].clientX : e.clientX;
          card.style.transition = 'none';
        };
        
        const onMove = (e) => {
          if (!isDragging) return;
          currentX = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
          card.style.transform = `translateX(${currentX}px) rotate(${currentX * 0.05}deg)`;
        };
        
        const onEnd = () => {
          if (!isDragging) return;
          isDragging = false;
          card.style.transition = 'transform .3s ease, opacity .3s ease';
          
          if (Math.abs(currentX) > 80) {
            if (currentX > 0) {
              card.classList.add('swipe-right');
              setTimeout(() => {
                currentTinderIndex = (currentTinderIndex - 1 + sorted.length) % sorted.length;
                renderCards();
              }, 300);
            } else {
              card.classList.add('swipe-left');
              setTimeout(() => {
                currentTinderIndex = (currentTinderIndex + 1) % sorted.length;
                renderCards();
              }, 300);
            }
          } else {
            card.style.transform = '';
          }
          currentX = 0;
        };
        
        card.addEventListener('touchstart', onStart, { passive: true });
        card.addEventListener('touchmove', onMove, { passive: true });
        card.addEventListener('touchend', onEnd);
        card.addEventListener('mousedown', onStart);
        card.addEventListener('mousemove', onMove);
        card.addEventListener('mouseup', onEnd);
        card.addEventListener('mouseleave', onEnd);
      }

      $('#prevBtn').onclick = () => {
        currentTinderIndex = (currentTinderIndex - 1 + sorted.length) % sorted.length;
        renderCards();
      };
      
      $('#nextBtn').onclick = () => {
        currentTinderIndex = (currentTinderIndex + 1) % sorted.length;
        renderCards();
      };

      renderCards();

      const actionsDiv = document.createElement('div');
      
      let quickActions = `

        <div class="grid g3">
          <div class="card clickable" onclick="document.querySelector('[data-view=projection]').click()">
            <div style="font-size:20px;margin-bottom:8px">🖥️</div>

            <div style="font-size:12px;color:var(--text-2)">Mode culte</div>

            <div class="card clickable" onclick="openNewSunday()">

              <div style="font-weight:600;margin-bottom:4px">Nouveau dimanche</div>
              <div style="font-size:12px;color:var(--text-2)">Créer un programme</div>
            </div>
            <div class="card clickable" onclick="document.querySelector('[data-view=projection]').click()">
              <div style="font-size:20px;margin-bottom:8px">🖥️</div>
              <div style="font-weight:600;margin-bottom:4px">Projection</div>
              <div style="font-size:12px;color:var(--text-2)">Mode culte</div>
            </div>
          </div>
        `;
      }
      
      actionsDiv.innerHTML = quickActions;
      view.appendChild(actionsDiv);

    /* ===== DIMANCHES ===== */
    function renderSundays(view) {
      view.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px">
          <div>
            <h2 class="page-title">Dimanches</h2>
            <p class="page-sub" style="margin-bottom:0">${STATE.sundays.length} programmes</p>
          </div>
          ${isAdmin ? `<button class="btn btn-primary btn-sm" onclick="openNewSunday()">➕ Nouveau</button>` : ''}
        </div>
        <div class="field">
          <input type="search" id="filterQ" placeholder="🔍 Rechercher un titre, chantre ou date...">
        </div>
        <div id="sundayList"></div>
      `;

      const draw = () => {
        const q = ($('#filterQ')?.value || '').toLowerCase().trim();
        const sorted = [...STATE.sundays].sort((a, b) => a.date.localeCompare(b.date));
        const list = sorted.filter(s => {
          if (!q) return true;
          if (s.date.includes(q)) return true;
          return [...(s.adoration || []), ...(s.louange || [])].some(x =>
            (x.title || '').toLowerCase().includes(q) || (x.singer || '').toLowerCase().includes(q)
          );
        });

        $('#sundayList').innerHTML = list.length === 0
          ? '<div class="empty"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>Aucun résultat</div>'
          : list.map(s => {
            const singers = [...new Set([...(s.adoration || []), ...(s.louange || [])].map(x => x.singer))];
            return `<div class="scard" style="margin-bottom:10px" onclick="openSunday('${s.date}')">
              <div class="date">${fmtDate(s.date)}</div>
              <div class="pills">
                <span class="pill pill-a">${(s.adoration || []).length}A</span>
                <span class="pill pill-l">${(s.louange || []).length}L</span>
              </div>
              <div class="singers">${esc(singers.join(' • '))}</div>
            </div>`;
          }).join('');
      };
      $('#filterQ').addEventListener('input', draw);
      draw();
    }

    /* ===== CALENDRIER ===== */
    function renderCalendar(view) {
      view.innerHTML = `
        <h2 class="page-title">Calendrier</h2>
        <p class="page-sub">Touchez un dimanche doré</p>
        <div class="cal-grid" id="calGrid"></div>
      `;

      const byMonth = {};
      STATE.sundays.forEach(s => {
        const k = s.date.slice(0, 7);
        if (!byMonth[k]) byMonth[k] = [];
        byMonth[k].push(s);
      });

      const keys = Object.keys(byMonth).sort();

      $('#calGrid').innerHTML = keys.map(k => {
        const [y, m] = k.split('-').map(Number);
        const md = new Date(y, m - 1, 1);
        const title = md.toLocaleDateString('fr-FR', { month: 'long', year: 'numeric' });
        const first = new Date(y, m - 1, 1).getDay();
        const last = new Date(y, m, 0).getDate();
        const hasDates = new Set(byMonth[k].map(s => Number(s.date.slice(-2))));

        let cells = ['D', 'L', 'M', 'M', 'J', 'V', 'S'].map(d => `<div class="dow">${d}</div>`).join('');
        for (let i = 0; i < first; i++) cells += '<div></div>';
        for (let d = 1; d <= last; d++) {
          if (hasDates.has(d)) {
            const iso = `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            cells += `<div class="day has" onclick="openSunday('${iso}')">${d}</div>`;
          } else {
            cells += `<div class="day">${d}</div>`;
          }
        }
        return `<div class="month-card"><div class="month-title">${title}</div><div class="mgrid">${cells}</div></div>`;
      }).join('');
    }

    /* ===== PAR CHANTRE ===== */
    function renderBySinger(view) {
      view.innerHTML = `
        <h2 class="page-title">Par chantre</h2>
        <p class="page-sub">Affectations individuelles</p>
        <div class="singer-grid" id="singerGrid"></div>
        <div id="singerContent" style="margin-top:24px"></div>
      `;

      const grid = $('#singerGrid');
      const content = $('#singerContent');

      grid.innerHTML = STATE.singers.map(name => {
        const count = STATE.sundays.reduce((acc, s) => {
          return acc + [...(s.adoration || []), ...(s.louange || [])].filter(x => x.singer === name).length;
        }, 0);
        return `<div class="singer-badge" data-singer="${esc(name)}">
          ${esc(name)} <span class="count">${count}</span>
        </div>`;
      }).join('');

      const badges = $$('.singer-badge');
      if (badges.length > 0) {
        badges[0].classList.add('active');
        drawSingerContent(badges[0].dataset.singer);
      }

      badges.forEach(b => {
        b.addEventListener('click', () => {
          badges.forEach(x => x.classList.remove('active'));
          b.classList.add('active');
          drawSingerContent(b.dataset.singer);
        });
      });

      function drawSingerContent(name) {
        const list = STATE.sundays.map(s => ({
          date: s.date,
          songs: [
            ...(s.adoration || []).map(x => ({ ...x, cat: 'a' })),
            ...(s.louange || []).map(x => ({ ...x, cat: 'l' }))
          ].filter(x => x.singer === name)
        })).filter(s => s.songs.length > 0).sort((a, b) => a.date.localeCompare(b.date));

        const totalSongs = list.reduce((acc, s) => acc + s.songs.length, 0);

        content.innerHTML = `
          <div class="grid g4" style="margin-bottom:16px">
            <div class="stat"><div class="n">${list.length}</div><div class="l">Dimanches</div></div>
            <div class="stat"><div class="n">${totalSongs}</div><div class="l">Chants</div></div>
          </div>
          ${list.length === 0 ? '<div class="empty">Aucune affectation</div>' : list.map(s => `
            <div class="card" style="margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px">
                <div style="font-weight:600;font-size:14px">${fmtDate(s.date)}</div>
                <button class="btn btn-ghost btn-sm" onclick="openSunday('${s.date}')">Voir →</button>
              </div>
              ${s.songs.map(x => `
                <div style="padding:8px 0;border-top:1px solid var(--border)">
                  <div style="font-size:10px;color:${x.cat === 'a' ? 'var(--gold)' : 'var(--blue)'};font-weight:600;letter-spacing:.05em;margin-bottom:3px">
                    ${x.cat === 'a' ? 'ADORATION' : 'LOUANGE'}
                  </div>
                  <div style="font-size:13px;color:var(--text)">${esc(x.title)}</div>
                </div>
              `).join('')}
            </div>
          `).join('')}
        `;
      }
    }

    /* ===== RECHERCHE ===== */
    function renderSearch(view) {
      view.innerHTML = `
        <h2 class="page-title">Recherche</h2>
        <p class="page-sub">Trouver un chant, un chantre, une date</p>
        <div class="field">
          <input type="search" id="searchQ" placeholder="🔍 Titre, chantre, date...">
        </div>
        <div id="searchResults"></div>
      `;

      const draw = () => {
        const q = ($('#searchQ')?.value || '').toLowerCase().trim();
        const results = $('#searchResults');
        if (!q) { results.innerHTML = '<div class="empty">Tapez pour rechercher</div>'; return; }

        const hits = [];
        STATE.sundays.forEach(s => {
          [...(s.adoration || []).map(x => ({ ...x, cat: 'Adoration' })), ...(s.louange || []).map(x => ({ ...x, cat: 'Louange' }))].forEach(x => {
            if ((x.title || '').toLowerCase().includes(q) || (x.singer || '').toLowerCase().includes(q)) {
              hits.push({ ...x, date: s.date });
            }
          });
        });

        results.innerHTML = hits.length === 0
          ? '<div class="empty">Aucun résultat</div>'
          : hits.map(h => `
            <div class="card" style="margin-bottom:10px" onclick="openSunday('${h.date}')">
              <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px">
                <span class="pill ${h.cat === 'Adoration' ? 'pill-a' : 'pill-l'}">${h.cat}</span>
                <span style="font-size:11px;color:var(--text-3)">${fmtDate(h.date)}</span>
              </div>
              <div style="font-weight:500;font-size:14px">${esc(h.title)}</div>
              <div style="font-size:12px;color:var(--gold);margin-top:4px">${esc(h.singer)}</div>
            </div>
          `).join('');
      };
      $('#searchQ').addEventListener('input', draw);
      draw();
    }

    /* ===== PROJECTION ===== */
    function renderProjection(view, dateOverride) {
      const today = new Date().toISOString().slice(0, 10);
      const sorted = [...STATE.sundays].sort((a, b) => a.date.localeCompare(b.date));
      const defaultDate = sorted.find(s => s.date >= today)?.date || sorted[sorted.length - 1]?.date;
      const date = dateOverride || defaultDate;

      view.innerHTML = `
        <h2 class="page-title">Projection</h2>
        <p class="page-sub">Plein écran pour le culte</p>
        <div class="field">
          <select id="projSel">
            ${STATE.sundays.map(s => `<option value="${s.date}" ${s.date === date ? 'selected' : ''}>${fmtDate(s.date)}</option>`).join('')}
          </select>
        </div>
        <div id="projContent"></div>
      `;

      const draw = () => {
        const d = $('#projSel').value;
        const s = STATE.sundays.find(x => x.date === d);
        if (!s) return;
        const singers = [...new Set([...(s.adoration || []), ...(s.louange || [])].map(x => x.singer))];

        $('#projContent').innerHTML = `
          <div class="proj">
            <h1>Abraham Berne <span class="gold">myGod</span></h1>
            <div class="date">${fmtDate(s.date)}</div>
            <div class="singers-line">${singers.map(esc).join(' • ')}</div>
            <h2>ADORATION</h2>
            ${(s.adoration || []).map(x => `
              <div class="song-block">
                <div class="title">${esc(x.title)}</div>
                <div class="singer">— ${esc(x.singer)}</div>
              </div>
            `).join('')}
            <h2>LOUANGE</h2>
            ${(s.louange || []).map(x => `
              <div class="song-block">
                <div class="title">${esc(x.title)}</div>
                <div class="singer">— ${esc(x.singer)}</div>
              </div>
            `).join('')}
          </div>
        `;
      };
      $('#projSel').addEventListener('change', draw);
      draw();
    }

    /* ===== MODAL VOIR DIMANCHE ===== */
    window.openSunday = function(date) {
      const s = STATE.sundays.find(x => x.date === date);
      if (!s) return;
      const singers = [...new Set([...(s.adoration || []), ...(s.louange || [])].map(x => x.singer))];

      const songRow = (song, cat) => {
        const thumb = ytThumb(song.url);
        const id = ytId(song.url);
        return `
          <div class="song-item">
            ${thumb ? `<img src="${thumb}" class="song-thumb" alt="">` : `<div class="song-thumb">♪</div>`}
            <div class="song-info">
              <div class="song-title">${esc(song.title)}</div>
              <div class="song-meta">
                <span class="singer">${esc(song.singer)}</span>
                <span>${cat === 'a' ? 'Adoration' : 'Louange'}</span>
              </div>
            </div>
            <div class="song-actions">
              ${id ? `<a href="${esc(song.url)}" target="_blank" rel="noopener" class="btn btn-primary btn-icon" title="Ouvrir sur YouTube">▶</a>` : `<span class="song-missing">△</span>`}
              ${isAdmin ? `<button class="btn btn-ghost btn-icon" onclick="editSong('${date}','${cat}','${esc(song.title).replace(/'/g, "\\'")}')" title="Modifier">✎</button>` : ''}
            </div>
          </div>
        `;
      };

      openModal(`
        <div class="modal-header">
          <h3>${fmtDate(s.date)}</h3>
          <button class="btn-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div style="font-size:13px;color:var(--text-2);margin-bottom:16px">
          <b>Chantres :</b> ${singers.map(esc).join(' · ')}
        </div>

        <h3 class="section" style="margin-top:8px">Adoration</h3>
        ${(s.adoration || []).map(x => songRow(x, 'a')).join('') || '<div class="empty">—</div>'}

        <h3 class="section">Louange</h3>
        ${(s.louange || []).map(x => songRow(x, 'l')).join('') || '<div class="empty">—</div>'}

        <div style="margin-top:20px;display:flex;gap:8px;flex-wrap:wrap">
          ${isAdmin ? `<button class="btn btn-primary" style="flex:1" onclick="openEditor('${date}')">✎ Modifier le programme</button>` : ''}
          <button class="btn btn-ghost" onclick="projFromModal('${date}')">🖥️ Projeter</button>
        </div>
      `);
    };

    window.projFromModal = function(date) {
      closeModal();
      $$('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.view === 'projection'));
      currentView = 'projection';
      renderProjection($('#view'), date);
    };

    window.closeModal = closeModal;

    /* ===== ÉDITEUR ===== */
    window.openNewSunday = function() {
      if (!isAdmin) return;
      const today = new Date();
      const nextSun = new Date(today);
      nextSun.setDate(today.getDate() + (7 - today.getDay()) % 7);
      const iso = nextSun.toISOString().slice(0, 10);
      openEditor(null, iso);
    };

    window.openEditor = function(date, suggestedDate) {
      if (!isAdmin) return;
      
      const isNew = !date;
      const s = isNew
        ? { date: suggestedDate || new Date().toISOString().slice(0, 10), adoration: [], louange: [] }
        : clone(STATE.sundays.find(x => x.date === date));

      if (!s) return;

      openModal(`
        <div class="modal-header">
          <h3>${isNew ? 'Nouveau dimanche' : 'Modifier le programme'}</h3>
          <button class="btn-close" onclick="closeModal()"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg></button>
        </div>
        <div class="field">
          <label>Date du dimanche</label>
          <input type="date" id="edDate" value="${s.date}" ${isNew ? '' : 'disabled'}>
        </div>
        <h3 class="section" style="margin-top:20px">Adoration (${s.adoration.length})</h3>
        <div id="edAdoration"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="edAddSong('a')">+ Ajouter un chant d'adoration</button>
        <h3 class="section">Louange (${s.louange.length})</h3>
        <div id="edLouange"></div>
        <button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="edAddSong('l')">+ Ajouter un chant de louange</button>
        <div style="margin-top:24px;display:flex;gap:8px">
          <button class="btn btn-ghost" style="flex:1" onclick="closeModal()">Annuler</button>
          ${!isNew ? `<button class="btn btn-danger" onclick="deleteSunday('${date}')">Supprimer</button>` : ''}
          <button class="btn btn-primary" style="flex:1.5" onclick="saveSunday(${isNew ? null : `'${date}'`})">${isNew ? 'Créer' : 'Enregistrer'}</button>
        </div>
      `);

      window._editorState = s;
      drawEditorLists();
    };

    function drawEditorLists() {
      const s = window._editorState;

      const renderList = (arr, cat) => arr.map((x, i) => `
        <div class="song-item" style="padding:10px">
          <div class="song-info">
            <input data-cat="${cat}" data-idx="${i}" data-field="title" value="${esc(x.title)}" style="margin-bottom:6px;font-size:13px;padding:8px 10px" placeholder="Titre">
            <div style="display:flex;gap:6px">
              <select data-cat="${cat}" data-idx="${i}" data-field="singer" style="flex:1;font-size:12px;padding:8px 10px">
                ${STATE.singers.map(n => `<option ${n === x.singer ? 'selected' : ''}>${esc(n)}</option>`).join('')}
              </select>
            </div>
            <input data-cat="${cat}" data-idx="${i}" data-field="url" value="${esc(x.url || '')}" placeholder="https://youtu.be/..." style="margin-top:6px;font-size:12px;padding:8px 10px">
          </div>
          <button class="btn btn-ghost btn-icon" style="color:var(--red)" onclick="edRemoveSong('${cat}',${i})">✕</button>
        </div>
      `).join('');

      $('#edAdoration').innerHTML = renderList(s.adoration, 'a') || '<div class="empty" style="padding:12px">Aucun chant</div>';
      $('#edLouange').innerHTML = renderList(s.louange, 'l') || '<div class="empty" style="padding:12px">Aucun chant</div>';

      $$('#modalBody input[data-field], #modalBody select[data-field]').forEach(el => {
        el.oninput = el.onchange = (e) => {
          const cat = e.target.dataset.cat;
          const idx = Number(e.target.dataset.idx);
          const field = e.target.dataset.field;
          const arr = cat === 'a' ? s.adoration : s.louange;
          if (arr[idx]) arr[idx][field] = e.target.value;
        };
      });

      $$('#modalBody h3.section').forEach((h, i) => {
        if (i === 0) h.textContent = `Adoration (${s.adoration.length})`;
        if (i === 1) h.textContent = `Louange (${s.louange.length})`;
      });
    }

    window.edAddSong = function(cat) {
      if (!isAdmin) return;
      const s = window._editorState;
      const target = cat === 'a' ? s.adoration : s.louange;
      target.push({ singer: STATE.singers[0] || '', title: '', url: '' });
      drawEditorLists();
    };

    window.edRemoveSong = function(cat, idx) {
      if (!isAdmin) return;
      const s = window._editorState;
      const target = cat === 'a' ? s.adoration : s.louange;
      target.splice(idx, 1);
      drawEditorLists();
    };

    /* ===== SAUVEGARDE AVEC MISE À JOUR EN CASCADE ===== */
    window.saveSunday = function(originalDate) {
      if (!isAdmin) return;
      
      const s = window._editorState;
      if (!originalDate) {
        s.date = $('#edDate').value;
      }
      if (!s.date) { toast('Date requise'); return; }

      s.adoration = (s.adoration || []).filter(x => x.title.trim());
      s.louange = (s.louange || []).filter(x => x.title.trim());

      const updateOtherOccurrences = (editedSongs) => {
        editedSongs.forEach(song => {
          if (!song.title.trim()) return;
          
          const targetYtId = ytId(song.url);
          
          STATE.sundays.forEach(otherSunday => {
            [...(otherSunday.adoration || []), ...(otherSunday.louange || [])].forEach(otherSong => {
              const otherYtId = ytId(otherSong.url);
              const isSameSong = targetYtId ? (otherYtId === targetYtId) : (otherSong.title.trim() === song.title.trim());
              
              if (isSameSong && (otherSong.title !== song.title || otherSong.url !== song.url)) {
                otherSong.title = song.title;
                otherSong.url = song.url;
              }
            });
          });
        });
      };

      updateOtherOccurrences(s.adoration);
      updateOtherOccurrences(s.louange);

      const idx = STATE.sundays.findIndex(x => x.date === (originalDate || s.date));
      if (idx >= 0) {
        STATE.sundays[idx] = s;
      } else {
        STATE.sundays.push(s);
      }
      STATE.sundays.sort((a, b) => a.date.localeCompare(b.date));
      
      save();
      closeModal();
      render();
      toast('✓ Programme enregistré');
    };

    window.deleteSunday = function(date) {
      if (!isAdmin) return;
      if (!confirm('Supprimer définitivement ce dimanche ?')) return;
      STATE.sundays = STATE.sundays.filter(x => x.date !== date);
      save();
      closeModal();
      render();
      toast('Programme supprimé');
    };

    window.editSong = function(date, cat, title) {
      if (!isAdmin) return;
      const s = STATE.sundays.find(x => x.date === date);
      if (!s) return;
      const arr = cat === 'a' ? s.adoration : s.louange;
      const idx = arr.findIndex(x => x.title === title);
      if (idx < 0) return;
      openEditor(date);
    };

    window.confirmReset = function() {
      if (!isAdmin) {
        toast('🔒 Déverrouillez d\'abord le mode Admin');
        return;
      }
      if (!confirm('Réinitialiser toutes les données au programme d\'origine ?\n\nVos modifications seront perdues.')) return;
      localStorage.removeItem(STORAGE_KEY);
      STATE = { singers: clone(SEED_SINGERS), sundays: clone(SEED_SUNDAYS) };
      save();
      render();
      toast('✓ Données réinitialisées');
    };

    load();
    updateLockIcon();
    render();
  </script>

</body>
</html>
